<title>Kontobuch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Hanken+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: ledger book — a narrow tab rail on the left, one working sheet on the right; amounts set in mono like a Kontobuch column, income in green ink, expenses in red ink, final sums double-ruled. */
:root {
  --paper: #f3f5f1;
  --sheet: #ffffff;
  --ink: #1c2622;
  --muted: #5d6b66;
  --rule: #d8ded8;
  --rule-strong: #b9c3bc;
  --accent: #1e6a50;
  --accent-soft: #e2efe8;
  --on-accent: #ffffff;
  --haben: #1e6a50;
  --soll: #a8372b;
  --soll-soft: #f7e5e2;
  --warn: #8a5a00;
  --warn-soft: #f8eccf;
  --info: #2b5b84;
  --info-soft: #e1ebf4;
  --shadow: 0 1px 2px rgb(28 38 34 / .06), 0 8px 24px rgb(28 38 34 / .06);
  --f-display: "Bricolage Grotesque", "Hanken Grotesk", system-ui, sans-serif;
  --f-body: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #111715; --sheet: #182120; --ink: #e3ebe7; --muted: #95a49e;
    --rule: #28332f; --rule-strong: #3a4842; --accent: #5cbf95; --accent-soft: #1d3329;
    --on-accent: #0d1a14; --haben: #6fcca2; --soll: #ec8478; --soll-soft: #3a2220;
    --warn: #e5b350; --warn-soft: #362b14; --info: #8dbbe4; --info-soft: #1b2a38;
    --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #111715; --sheet: #182120; --ink: #e3ebe7; --muted: #95a49e;
  --rule: #28332f; --rule-strong: #3a4842; --accent: #5cbf95; --accent-soft: #1d3329;
  --on-accent: #0d1a14; --haben: #6fcca2; --soll: #ec8478; --soll-soft: #3a2220;
  --warn: #e5b350; --warn-soft: #362b14; --info: #8dbbe4; --info-soft: #1b2a38;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--paper); color: var(--ink); font: 15px/1.5 var(--f-body); }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: 1.9rem; font-weight: 700; letter-spacing: -.01em; }
h2 { font-size: 1.2rem; font-weight: 700; }
h3 { font-size: .78rem; font-weight: 600; font-family: var(--f-body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
p { margin: 0; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono, .amt { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.amt { white-space: nowrap; text-align: right; }
.in { color: var(--haben); } .out { color: var(--soll); }
.muted { color: var(--muted); }
.small { font-size: .85rem; }

.app { display: grid; grid-template-columns: 216px minmax(0, 1fr); min-height: 100vh; }
.rail { border-right: 1px solid var(--rule); padding: 24px 12px; display: flex; flex-direction: column; gap: 24px; position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; }
.brand { padding: 0 12px; display: flex; flex-direction: column; gap: 2px; }
.brand b { font-family: var(--f-display); font-size: 1.35rem; letter-spacing: -.01em; }
.brand span { font-size: .78rem; color: var(--muted); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button { all: unset; cursor: pointer; padding: 8px 12px; border-radius: var(--r); display: flex; justify-content: space-between; align-items: center; gap: 8px; color: var(--muted); font-weight: 500; }
.nav button:hover { color: var(--ink); background: var(--accent-soft); }
.nav button[aria-current="page"] { color: var(--ink); background: var(--sheet); box-shadow: inset 3px 0 0 var(--accent), var(--shadow); }
.nav button:focus-visible { outline: 2px solid var(--accent); }
.nav .count { font-family: var(--f-mono); font-size: .75rem; background: var(--warn-soft); color: var(--warn); padding: 0 6px; border-radius: 99px; }
.rail-foot { margin-top: auto; padding: 0 12px; font-size: .78rem; color: var(--muted); display: flex; flex-direction: column; gap: 6px; }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); margin-right: 6px; vertical-align: 1px; }
.dot.ok { background: var(--haben); } .dot.err { background: var(--soll); }

main { padding-inline: clamp(16px, 4vw, 48px); padding-block: 32px 64px; min-width: 0; display: flex; flex-direction: column; gap: 28px; max-width: 1180px; }
.head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; }
.head-l { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.btn { cursor: pointer; border: 1px solid var(--rule-strong); background: var(--sheet); padding: 7px 14px; border-radius: var(--r); font-weight: 500; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--soll); }
.btn.sm { padding: 3px 10px; font-size: .85rem; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { border-color: var(--rule-strong); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.icon-btn { all: unset; cursor: pointer; width: 32px; height: 32px; display: grid; place-items: center; border-radius: var(--r); font-size: 1.3rem; color: var(--muted); }
.icon-btn:hover { background: var(--accent-soft); color: var(--ink); }
.icon-btn:focus-visible { outline: 2px solid var(--accent); }

select.year { border: 1px solid var(--rule-strong); background: var(--sheet); border-radius: var(--r); padding: 6px 10px; font-family: var(--f-mono); }

.sheet-card { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); box-shadow: var(--shadow); }
.section { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }

.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 2px solid var(--ink); border-bottom: 1px solid var(--rule); }
.kpi { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 6px; border-left: 1px solid var(--rule); }
.kpi:first-child { border-left: 0; padding-left: 0; }
.kpi .v { font-family: var(--f-mono); font-size: 1.45rem; font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.kpi .s { font-size: .82rem; color: var(--muted); }

.grid2 { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 28px; align-items: start; }

.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: .74rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; padding: 10px 12px; border-bottom: 1px solid var(--rule-strong); white-space: nowrap; }
td { padding: 10px 12px; border-bottom: 1px solid var(--rule); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
th.r, td.r { text-align: right; }
td.actions { text-align: right; white-space: nowrap; }
td.actions .btn + .btn { margin-left: 4px; }
tbody tr.clickable { cursor: pointer; }
tbody tr.clickable:hover td { background: var(--accent-soft); }
tr.total td { border-top: 1px solid var(--ink); font-weight: 600; }
tr.grand td { border-bottom: 3px double var(--ink); font-weight: 600; }
.sub { display: block; font-size: .82rem; color: var(--muted); }
.strike { text-decoration: line-through; color: var(--muted); }

.chip { display: inline-flex; align-items: center; gap: 5px; font-size: .76rem; font-weight: 600; padding: 2px 9px; border-radius: 99px; white-space: nowrap; }
.chip.draft { background: var(--rule); color: var(--muted); }
.chip.open { background: var(--info-soft); color: var(--info); }
.chip.overdue { background: var(--warn-soft); color: var(--warn); }
.chip.paid { background: var(--accent-soft); color: var(--haben); }
.chip.cancelled { background: var(--soll-soft); color: var(--soll); }
.chip.in { background: var(--accent-soft); color: var(--haben); }
.chip.out { background: var(--soll-soft); color: var(--soll); }

.filters { display: flex; gap: 4px; flex-wrap: wrap; }
.filters button { cursor: pointer; border: 1px solid var(--rule); background: transparent; padding: 4px 12px; border-radius: 99px; font-size: .85rem; color: var(--muted); }
.filters button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
input.search { border: 1px solid var(--rule-strong); background: var(--sheet); border-radius: var(--r); padding: 6px 10px; min-width: 0; width: 220px; max-width: 100%; }

.meter { display: flex; flex-direction: column; gap: 6px; }
.meter .bar { height: 8px; background: var(--rule); border-radius: 99px; overflow: hidden; }
.meter .bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.meter .bar i.warn { background: var(--warn); } .meter .bar i.crit { background: var(--soll); }
.meter .row { display: flex; justify-content: space-between; gap: 8px; font-size: .85rem; }
.panel { padding: 18px; display: flex; flex-direction: column; gap: 16px; }
.note { font-size: .85rem; color: var(--muted); border-left: 2px solid var(--rule-strong); padding-left: 12px; }
.note.warn { border-color: var(--warn); color: var(--ink); }

.empty { padding: 36px 20px; display: flex; flex-direction: column; align-items: flex-start; gap: 12px; }
.empty p { max-width: 52ch; color: var(--muted); }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0; }
.steps li { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--rule); }
.steps li:last-child { border-bottom: 0; }
.steps .tick { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--rule-strong); display: grid; place-items: center; font-size: .75rem; flex: none; font-family: var(--f-mono); color: var(--muted); }
.steps .done .tick { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.steps .done span.t { color: var(--muted); text-decoration: line-through; }
.steps .t { flex: 1; min-width: 0; }

.banner { padding: 12px 16px; border-radius: var(--r); background: var(--warn-soft); color: var(--ink); font-size: .9rem; }

/* forms */
.form { display: flex; flex-direction: column; gap: 16px; }
.fields { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px 14px; }
.f { display: flex; flex-direction: column; gap: 4px; min-width: 0; grid-column: span 3; }
.f.full { grid-column: 1 / -1; } .f.s2 { grid-column: span 2; } .f.s4 { grid-column: span 4; } .f.s1 { grid-column: span 1; }
.f label, .lbl { font-size: .8rem; font-weight: 600; color: var(--muted); }
.f input, .f select, .f textarea, .item-row input, .item-row select { border: 1px solid var(--rule-strong); background: var(--sheet); border-radius: var(--r); padding: 7px 10px; width: 100%; min-width: 0; }
.f textarea { resize: vertical; min-height: 76px; }
.f .hint { font-size: .78rem; color: var(--muted); }
.check { display: flex; gap: 10px; align-items: flex-start; }
.check input { margin-top: 4px; accent-color: var(--accent); }
fieldset { border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 12px; }
legend { font-family: var(--f-display); font-weight: 700; font-size: 1.05rem; margin-bottom: 8px; padding: 0; }
.form-foot { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; padding-top: 4px; }
.form-foot .grp { display: flex; gap: 8px; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--rule-strong); border-radius: var(--r); overflow: hidden; }
.seg label { padding: 6px 14px; cursor: pointer; font-weight: 500; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg input:checked + span { color: var(--on-accent); }
.seg label:has(input:checked) { background: var(--accent); color: var(--on-accent); }
.seg label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: -2px; }

.items { display: flex; flex-direction: column; gap: 6px; }
.item-row { display: grid; grid-template-columns: minmax(0, 1fr) 72px 72px 104px 76px 100px 32px; gap: 6px; align-items: center; }
.item-row.ku { grid-template-columns: minmax(0, 1fr) 72px 72px 104px 100px 32px; }
.item-row output { font-family: var(--f-mono); text-align: right; font-variant-numeric: tabular-nums; }
.item-head { font-size: .74rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
.item-head span:nth-child(n+2) { text-align: right; }
.totals { margin-left: auto; width: min(320px, 100%); display: flex; flex-direction: column; gap: 4px; }
.totals div { display: flex; justify-content: space-between; gap: 12px; }
.totals .g { border-top: 1px solid var(--ink); border-bottom: 3px double var(--ink); padding-block: 4px; font-weight: 600; }

/* modal */
#modal { position: fixed; inset: 0; background: rgb(10 16 14 / .45); display: flex; align-items: flex-start; justify-content: center; padding: max(24px, env(safe-area-inset-top, 0px)) 16px 24px; overflow-y: auto; z-index: 20; }
.dialog { background: var(--sheet); border-radius: 10px; width: min(640px, 100%); box-shadow: 0 20px 60px rgb(0 0 0 / .3); display: flex; flex-direction: column; }
.dialog.wide { width: min(1040px, 100%); }
.dialog.extra-wide { width: min(1420px, 96vw); }
.dialog > header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--rule); gap: 12px; }
.dialog-body { padding: 20px; display: flex; flex-direction: column; gap: 16px; }

/* receipt preview & split dialog */
.split-layout { display: grid; grid-template-columns: minmax(360px, 480px) minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 900px) {
  .split-layout { grid-template-columns: minmax(0, 1fr); }
}
.preview-pane { display: flex; flex-direction: column; gap: 8px; background: var(--paper); border: 1px solid var(--rule); border-radius: var(--r); padding: 12px; position: sticky; top: 12px; }
.preview-bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: .82rem; }
.preview-bar .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 260px; }
.preview-content { border-radius: 4px; overflow: hidden; background: #fff; border: 1px solid var(--rule); display: flex; align-items: center; justify-content: center; min-height: 300px; }
.preview-frame { width: 100%; height: clamp(540px, 75vh, 880px); border: 0; background: #fff; }
.preview-img { width: 100%; max-height: clamp(540px, 75vh, 880px); object-fit: contain; }
.preview-modal-frame { width: 100%; height: 78vh; border: 0; background: #fff; }
.preview-modal-img { max-width: 100%; max-height: 78vh; object-fit: contain; display: block; margin: 0 auto; border-radius: 4px; }

/* invoice preview, DIN 5008 flavour */
.paper { background: #fff; color: #1a1a1a; border: 1px solid var(--rule); padding: 40px 44px; font-size: 13px; line-height: 1.45; display: flex; flex-direction: column; gap: 22px; color-scheme: light; }
.paper .ph { display: flex; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
.paper .ph b { font-family: var(--f-display); font-size: 20px; }
.paper .addr { white-space: pre-line; }
.paper .sender { font-size: 10px; color: #666; border-bottom: 1px solid #bbb; display: inline-block; margin-bottom: 4px; }
.paper .meta { display: grid; grid-template-columns: auto auto; gap: 2px 18px; align-self: flex-start; }
.paper .meta span:nth-child(odd) { color: #666; }
.paper table th { color: #666; border-bottom-color: #999; }
.paper table td { border-bottom-color: #ddd; }
.paper .foot { border-top: 1px solid #ccc; padding-top: 10px; font-size: 11px; color: #555; display: flex; flex-wrap: wrap; gap: 4px 20px; }
.paper h2 { color: #1a1a1a; }

#toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 18px; border-radius: var(--r); font-size: .9rem; z-index: 30; max-width: calc(100% - 32px); box-shadow: var(--shadow); }
#toast.err { background: var(--soll); color: #fff; }

@media (max-width: 960px) {
  .grid2 { grid-template-columns: minmax(0, 1fr); }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi:nth-child(3) { border-left: 0; padding-left: 0; }
  .kpi:nth-child(n+3) { border-top: 1px solid var(--rule); }
}
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--rule); padding: 14px 0 0; gap: 10px; }
  .brand { padding-inline: 16px; flex-direction: row; align-items: baseline; gap: 10px; }
  .nav { flex-direction: row; overflow-x: auto; padding: 0 12px 8px; }
  .nav button { white-space: nowrap; }
  .nav button[aria-current="page"] { box-shadow: inset 0 -2px 0 var(--accent); background: transparent; }
  .rail-foot { display: none; }
  main { padding-block: 20px 48px; gap: 22px; }
  h1 { font-size: 1.5rem; }
  .fields { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .f, .f.s2, .f.s4 { grid-column: 1 / -1; } .f.s1 { grid-column: span 1; }
  .item-row, .item-row.ku { grid-template-columns: 1fr 1fr 1fr; }
  .item-row input[data-f="desc"] { grid-column: 1 / -1; }
  .item-row output { grid-column: span 2; }
  .item-head { display: none; }
  .paper { padding: 24px 18px; }
}
@media (prefers-reduced-motion: no-preference) {
  .dialog { animation: rise .16s ease-out; }
  @keyframes rise { from { transform: translateY(8px); opacity: .6; } to { transform: none; opacity: 1; } }
}
</style>

<div class="app">
  <aside class="rail">
    <div class="brand"><b>Kontobuch</b><span id="brand-sub">Buchhaltung</span></div>

    <div class="rail-foot" id="rail-foot"><span><i class="dot"></i>Verbinde …</span></div>
  </aside>
  <main id="main" aria-live="polite"></main>
</div>
<div id="modal" hidden></div>
<div id="toast" hidden role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  ["185", "Gezahlte Vorsteuerbeträge"], ["183", "Übrige unbeschränkt abziehbare Betriebsausgaben"], ["175", "Bewirtungsaufwendungen (abziehbar)"],

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fEur = new Intl.NumberFormat("de-DE", { style: "currency", currency: "EUR" });
const fNum = new Intl.NumberFormat("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const eur = n => fEur.format(n || 0);
const num = n => fNum.format(n || 0);
const r2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
const parseNum = v => {
  let s = String(v ?? "").trim().replace(/\s|€/g, "");
  if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
};
const numIn = n => (n === "" || n == null) ? "" : String(n).replace(".", ",");
const pad = n => String(n).padStart(2, "0");
const isoDate = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => isoDate(new Date());
const addDays = (iso, days) => { const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + Number(days || 0)); return isoDate(d); };
const fDate = iso => iso ? iso.split("-").reverse().join(".") : "–";
const yOf = iso => iso ? Number(iso.slice(0, 4)) : null;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

/* ---------- money logic ---------- */
function calcInv(inv) {
  let net = 0; const byRate = {};
  for (const it of inv.items || []) {
    const line = r2(parseNum(it.qty) * parseNum(it.price));
    net += line;
    const rate = inv.ku ? 0 : Number(it.vat || 0);
    byRate[rate] = (byRate[rate] || 0) + line;
  }
  let vat = 0;
  for (const [rate, base] of Object.entries(byRate)) vat += r2(base * Number(rate) / 100);
  net = r2(net); vat = r2(vat);
  return { net, vat, gross: r2(net + vat), byRate };
}
function entryParts(e) {
  const rate = Number(e.vatRate || 0), gross = Number(e.gross || 0);
  const net = rate ? r2(gross / (1 + rate / 100)) : gross;
  return { gross, net, vat: r2(gross - net) };
}
const invState = inv => {
  if (inv.status === "open" && inv.dueDate && inv.dueDate < today()) return "overdue";
  return inv.status || "draft";
};
const STATUS_LABEL = { draft: "Entwurf", open: "Offen", overdue: "Überfällig", paid: "Bezahlt", cancelled: "Storniert" };
const chip = st => `<span class="chip ${st}">${STATUS_LABEL[st]}</span>`;
const custName = id => S.customers.find(c => c.id === id)?.name;
const invTitle = inv => inv.recipient ? inv.recipient.split("\n")[0] : (custName(inv.customerId) || "Ohne Empfänger");

/* Zufluss-Prinzip: Rechnungen zählen im Jahr der Zahlung. */
function journal(y) {
  const rows = [];
  for (const inv of S.invoices) {
    if (inv.status !== "paid" || yOf(inv.paidDate) !== y) continue;
    const t = calcInv(inv);
    rows.push({ src: "inv", id: inv.id, kind: "in", date: inv.paidDate, party: invTitle(inv), desc: `Rechnung ${inv.number}`, ref: inv.number,
      category: "rechnung", gross: t.gross, net: t.net, vat: t.vat, ku: !!inv.ku });
  }
  for (const e of S.entries) {
    if (yOf(e.date) !== y) continue;
    const p = entryParts(e);
    rows.push({ src: "entry", id: e.id, kind: e.kind, date: e.date, party: e.party, desc: e.desc, ref: e.ref || "", category: e.category,
      gross: p.gross, net: p.net, vat: p.vat, ku: !!e.ku, receiptId: e.receiptId, receiptName: e.receiptName });
  }
  return rows.sort((a, b) => b.date.localeCompare(a.date));
}
function euer(y) {
  const rows = journal(y);
  const sums = {}; let nonDeductible = 0;
  const add = (kz, v) => { if (v) sums[kz] = r2((sums[kz] || 0) + v); };
  for (const r of rows) {
    if (r.kind === "in") {
      if (r.vat === 0 && r.ku) add("111", r.gross);
      else { add("112", r.net); add("140", r.vat); }
    } else {
      let amt = r.net;
      add("185", r.vat);
      if (r.category === "bewirtung") { nonDeductible = r2(nonDeductible + r2(amt * 0.3)); amt = r2(amt * 0.7); }
      add(OUT_KZ[r.category] || "183", amt);
    }
  }
  const lines = list => list.filter(([kz]) => sums[kz]).map(([kz, label]) => ({ kz, label, amount: sums[kz] }));
  const inc = lines(INC_LINES), out = lines(OUT_LINES);
  const incTotal = r2(inc.reduce((a, l) => a + l.amount, 0)), outTotal = r2(out.reduce((a, l) => a + l.amount, 0));
  return { rows, inc, out, ust: sums["140"] || 0, vorsteuer: sums["185"] || 0, nonDeductible, incTotal, outTotal, profit: r2(incTotal - outTotal) };
}
/* Gesamtumsatz nach § 19 UStG: vereinnahmte Entgelte. */
function kuTurnover(y) {
  return r2(journal(y).filter(r => r.kind === "in" && r.category !== "sonstige_in").reduce((a, r) => a + r.net, 0));
}
function years() {
  const ys = new Set([new Date().getFullYear(), year]);
  S.invoices.forEach(i => { if (i.date) ys.add(yOf(i.date)); if (i.paidDate) ys.add(yOf(i.paidDate)); });
  S.entries.forEach(e => e.date && ys.add(yOf(e.date)));
  return [...ys].sort((a, b) => b - a);
}

/* ---------- db writes ---------- */
async function guard(fn, okMsg) {
  if (!db) { toast("Der Datenspeicher ist in dieser Ansicht nicht verfügbar.", true); return false; }
  try { const r = await fn(); if (okMsg) toast(okMsg); return r ?? true; }
  catch (e) {
    console.error(e);
    const code = e?.code;
    const msg = code === "quota_exceeded" ? "Speicher voll. Lösche alte Einträge oder exportiere ein Backup."
      : code === "invalid_argument" ? "Speichern abgelehnt. Nur die Besitzerin oder der Besitzer dieses Kontobuchs kann Daten ändern."
      : "Speichern fehlgeschlagen. Bitte versuche es gleich noch einmal.";
    toast(msg, true); return false;
  }
}
const saveSettings = patch => guard(() => db.doc("book/main").set({ ...sett(), ...patch, updatedAt: new Date().toISOString() }));
const saveDoc = (coll, id, data) => guard(() => db.collection(coll).doc(id).set({ ...data, updatedAt: new Date().toISOString() }));
const delDoc = (coll, id) => guard(() => db.collection(coll).doc(id).delete());

/* ---------- toast ---------- */
let toastT;
function toast(msg, err) {
  const t = $("#toast"); t.textContent = msg; t.className = err ? "err" : ""; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, err ? 6000 : 2600);
}

let lastFocus = null;
function openModal(title, body, { wide, extraWide } = {}) {

    <div class="dialog-body">${body}</div></div>`;
  m.hidden = false;
  ($("[autofocus]", m) || $("input,select,textarea", m) || $("button", m))?.focus();
}
function closeModal() { const m = $("#modal"); m.hidden = true; m.innerHTML = ""; ed = null; lastFocus?.focus?.(); }
function confirmBox(title, text, yesLabel, onYes, danger = true) {

function kuPanel() {
  const s = sett();
  const cy = new Date().getFullYear();
  const cur = kuTurnover(cy), prev = kuTurnover(cy - 1);
  const bar = (v, max) => { const p = Math.min(100, v / max * 100); return `<div class="bar"><i class="${p >= 100 ? "crit" : p >= 80 ? "warn" : ""}" style="width:${p.toFixed(1)}%"></i></div>`; };
  if (!s.kleinunternehmer) return `<div class="sheet-card panel"><h2>Umsatzsteuer</h2><p class="small muted">Du rechnest mit Umsatzsteuer ab. Die Summen für deine Umsatzsteuer-Voranmeldung findest du unter EÜR.</p></div>`;
  let msg = "";
  if (cur > KU_CUR) msg = `<p class="note warn">Du hast ${eur(KU_CUR)} in ${cy} überschritten. Ab dem Umsatz, der die Grenze überschreitet, gilt die Regelbesteuerung. Sprich bitte mit deiner Steuerberatung und stelle in den Einstellungen um.</p>`;
  else if (cur > KU_PREV) msg = `<p class="note warn">Du liegst in ${cy} über ${eur(KU_PREV)}. Damit bist du ab ${cy + 1} kein Kleinunternehmer mehr.</p>`;
  return `<div class="sheet-card panel">
    <div><h2>Kleinunternehmergrenze</h2><p class="small muted">§ 19 UStG: Umsatz im Vorjahr höchstens ${eur(KU_PREV)}, im laufenden Jahr höchstens ${eur(KU_CUR)}.</p></div>
    <div class="meter"><div class="row"><span>${cy} (laufend)</span><span class="mono">${eur(cur)} / ${num(KU_CUR).replace(",00", "")} €</span></div>${bar(cur, KU_CUR)}</div>
    <div class="meter"><div class="row"><span>${cy} für ${cy + 1}</span><span class="mono">${eur(cur)} / ${num(KU_PREV).replace(",00", "")} €</span></div>${bar(cur, KU_PREV)}</div>
    <div class="meter"><div class="row"><span>${cy - 1} (Vorjahr)</span><span class="mono">${eur(prev)} / ${num(KU_PREV).replace(",00", "")} €</span></div>${bar(prev, KU_PREV)}</div>
    ${msg}
    <p class="small muted">Gezählt werden bezahlte Rechnungen und Umsätze ohne Rechnung. Umsätze aus der Zeit vor dem Kontobuch kannst du als Einnahme nachtragen.</p>
  </div>`;
}

/* {JAHR} im Präfix: die Nummern laufen pro Jahr und beginnen im neuen Jahr wieder bei 1. */
function nextInvoice(y = new Date().getFullYear()) {
  const s = sett(); const raw = s.invoicePrefix || ""; const prefix = raw.replaceAll("{JAHR}", y);
  const base = !raw.includes("{JAHR}") || Number(s.counterYear) === y ? Number(s.nextInvoiceNo || 1) : 1;
  const used = S.invoices.filter(i => i.number?.startsWith(prefix)).map(i => (parseInt(i.number.slice(prefix.length), 10) || 0) + 1);
  const n = Math.max(base, ...used);
  return { n, y, number: prefix + String(n).padStart(Number(s.numberPad || 3), "0") };
}

function nextCustNo(taken = S.customers.map(c => c.customerNo)) {
  const nums = taken.filter(n => /^\d+$/.test(n || ""));
  if (!nums.length) return "1001";
  const top = nums.reduce((a, b) => (+b > +a ? b : a));
  return String(+top + 1).padStart(top.length, "0");
}

function partyNames(kind) {
  const names = kind === "in" ? S.customers.map(c => c.name) : (sett().suppliers || []);
  const seen = new Set(); const out = [];
  for (const n of [...S.entries.filter(x => x.kind === kind).map(x => x.party), ...names]) {
    if (n && !seen.has(n.toLowerCase())) { seen.add(n.toLowerCase()); out.push(n); }
  }
  return out.sort((a, b) => a.localeCompare(b, "de"));
}

async function submitEntry(form) {
  const fd = new FormData(form); const id = form.dataset.id || uid();
  const old = S.entries.find(x => x.id === id) || {};
  const gross = r2(parseNum(fd.get("gross")));
  if (!gross) { toast("Bitte gib einen Betrag ein.", true); return; }
  const kind = fd.get("kind");
  const data = { kind, date: fd.get("date"), gross, party: fd.get("party").trim(), desc: fd.get("desc").trim(), ref: fd.get("ref").trim(),
    category: fd.get("category"), ku: old.id ? !!old.ku : !!sett().kleinunternehmer,
    vatRate: Number(fd.get("vatRate") || 0), receiptId: old.receiptId || null, receiptName: old.receiptName || null, createdAt: old.createdAt || new Date().toISOString() };
  if (kind === "in" && !IN_CATS.some(c => c[0] === data.category)) data.category = "umsatz";
  if (kind === "out" && !OUT_CATS.some(c => c[0] === data.category)) data.category = "sonstige";
  const btn = $("button[type=submit]", form); btn.disabled = true;
  const file = fd.get("file");
  let toDelete = null;
  if (fd.get("removeReceipt") && data.receiptId) { toDelete = data.receiptId; data.receiptId = null; data.receiptName = null; }
  if (file && file.size && assets) {
    btn.textContent = "Lade Beleg hoch …";
    const ext = (file.name.split(".").pop() || "").toLowerCase();
    const type = { pdf: "application/pdf", jpg: "image/jpeg", jpeg: "image/jpeg", png: "image/png", webp: "image/webp" }[ext] || file.type;
    try {
      const up = await assets.upload(file, { type });
      if (data.receiptId) toDelete = data.receiptId;
      data.receiptId = up.id; data.receiptName = file.name;
    } catch (err) {
      console.error(err);
      const m = { too_large: "Die Datei ist größer als 20 MB.", unsupported_type: "Dieses Dateiformat geht nicht. Bitte PDF, JPG, PNG oder WebP.", quota_or_state: "Der Speicher für Belege ist voll." }[err?.code] || "Der Beleg konnte nicht hochgeladen werden.";
      toast(m, true); btn.disabled = false; btn.textContent = "Speichern"; return;
    }
  }
  if (await saveDoc("entries", id, data)) {
    if (toDelete && assets) assets.delete(toDelete).catch(() => {});
    closeModal(); toast(kind === "in" ? "Einnahme gespeichert" : "Ausgabe gespeichert");
  } else { btn.disabled = false; btn.textContent = "Speichern"; }
}

function readInvoiceForm() {
  const f = $('form[data-form="invoice"]'); const fd = new FormData(f);
  Object.assign(ed, { customerId: fd.get("customerId"), recipient: fd.get("recipient").trim(), date: fd.get("date"), serviceDate: fd.get("serviceDate").trim(),
    dueDays: Number(fd.get("dueDays") || 0), intro: fd.get("intro").trim(), notes: fd.get("notes").trim() });
  ed.items = ed.items.map(it => ({ desc: String(it.desc).trim(), qty: parseNum(it.qty), unit: String(it.unit || "").trim(), price: r2(parseNum(it.price)), vat: ed.ku ? 0 : Number(it.vat || 0) }))
    .filter(it => it.desc || it.price);
  if (!ed.items.length) ed.items = [{ desc: "", qty: 1, unit: "", price: 0, vat: 19 }];
}

    dueDays: ed.dueDays, dueDate: addDays(ed.date, ed.dueDays), intro: ed.intro, notes: ed.notes, items: ed.items, ku: ed.ku,
    customerNo: S.customers.find(c => c.id === ed.customerId)?.customerNo || null,
    net: t.net, vat: t.vat, gross: t.gross, createdAt: ed.createdAt || new Date().toISOString(), ...extra };
}
async function saveDraft() {

  if (await saveDoc("invoices", id, invoiceDoc({ status: "draft" }))) { closeModal(); toast("Entwurf gespeichert"); }
}
async function finalizeInvoice() {
  readInvoiceForm();
  if (!ed.recipient) { toast("Bitte gib einen Empfänger an.", true); return; }
  if (!ed.items.some(it => it.desc && it.price)) { toast("Mindestens eine Position braucht Beschreibung und Preis.", true); return; }
  if (ed.items.some(it => !it.desc)) { toast("Jede Position braucht eine Beschreibung.", true); return; }
  const s = sett();
  if (!s.name || !s.street || !s.taxNo) { toast("Trag zuerst Name, Anschrift und Steuernummer in den Einstellungen ein. Sie müssen auf jeder Rechnung stehen.", true); return; }
  const { n, y, number } = nextInvoice(yOf(ed.date));
  if (S.invoices.some(i => i.number === number)) { toast(`Die Nummer ${number} gibt es schon. Passe die nächste Nummer in den Einstellungen an.`, true); return; }
  const btn = $('form[data-form="invoice"] button[type=submit]'); if (btn) btn.disabled = true;
  if (!await saveSettings({ nextInvoiceNo: n + 1, counterYear: y })) { if (btn) btn.disabled = false; return; }
  const seller = Object.fromEntries(SELLER_FIELDS.map(k => [k, s[k] || ""])); seller.closing = s.closing;
  const id = ed.id || uid();
  if (await saveDoc("invoices", id, invoiceDoc({ status: "open", number, seller, finalizedAt: new Date().toISOString() }))) {
    closeModal(); toast(`Rechnung ${number} festgeschrieben`); openInvoice(id);
  }
}

/* ---------- ZUGFeRD 2.2 / Factur-X (EN 16931) ---------- */
function xmlEsc(s) {
  return String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&apos;");
}
function date102(iso) {
  return (iso || "").replace(/-/g, "").slice(0, 8);
}
function unitCode(u) {
  const s = String(u || "").trim().toLowerCase();
  if (["std.", "std", "h", "stunde", "stunden"].includes(s)) return "HUR";
  if (["tag", "tage"].includes(s)) return "DAY";
  if (["monat", "monate"].includes(s)) return "MON";
  if (["m", "meter"].includes(s)) return "MTR";
  if (["qm", "m²", "m2"].includes(s)) return "MTK";
  if (["kg"].includes(s)) return "KGM";
  if (["l", "liter"].includes(s)) return "LTR";
  return "C62";
}
function parseRecipient(text, customer) {
  if (customer) {
    return {
      name: customer.name || "",
      contact: customer.contact || "",
      street: customer.street || "",
      zip: customer.zip || "",
      city: customer.city || "",
      country: customer.country ? (customer.country.length === 2 ? customer.country.toUpperCase() : "DE") : "DE",
      vatId: customer.vatId || "",
      customerNo: customer.customerNo || ""
    };
  }
  const lines = (text || "").split("\n").map(l => l.trim()).filter(Boolean);
  const name = lines[0] || "Kunde";
  let street = "", zip = "", city = "", country = "DE";
  for (let i = 1; i < lines.length; i++) {
    const l = lines[i];
    const m = l.match(/^(\d{4,5})\s+(.+)$/);
    if (m) {
      zip = m[1]; city = m[2];
    } else if (i === lines.length - 1 && ["deutschland", "österreich", "schweiz"].includes(l.toLowerCase())) {
      country = l.toLowerCase() === "österreich" ? "AT" : l.toLowerCase() === "schweiz" ? "CH" : "DE";
    } else if (!street) {
      street = l;
    }
  }
  return { name, street, zip, city, country, contact: "", vatId: "", customerNo: "" };
}
function generateFacturXXml(inv, s = sett(), customers = S.customers) {

  const cust = (customers || []).find(c => c.id === inv.customerId);
  const buyer = parseRecipient(inv.recipient, cust);
  if (inv.customerNo && !buyer.customerNo) buyer.customerNo = inv.customerNo;

  const typeCode = inv.storno ? "381" : "380";
  const issueDate = date102(inv.date || today());
  let deliveryDate = issueDate;
  if (inv.serviceDate && /^\d{4}-\d{2}-\d{2}$/.test(inv.serviceDate)) {
    deliveryDate = date102(inv.serviceDate);
  }
  const dueDate = inv.dueDate ? date102(inv.dueDate) : issueDate;

  const notes = [];
  if (inv.ku) notes.push("Gemäß § 19 UStG wird keine Umsatzsteuer berechnet.");
  if (inv.storno) notes.push(`Storno zu Rechnung ${inv.refNumber || ""} vom ${inv.refDate || ""}.`);
  if (inv.notes) notes.push(inv.notes);

  const itemsXml = (inv.items || []).map((it, i) => {
    const qty = parseNum(it.qty) || 1;
    const price = parseNum(it.price) || 0;
    const lineTotal = r2(qty * price);
    const vatRate = inv.ku ? 0 : Number(it.vat || 0);
    const catCode = inv.ku ? "O" : (vatRate > 0 ? "S" : "Z");
    return `    <ram:IncludedSupplyChainTradeLineItem>
      <ram:AssociatedDocumentLineDocument>
        <ram:LineID>${i + 1}</ram:LineID>
      </ram:AssociatedDocumentLineDocument>
      <ram:SpecifiedTradeProduct>
        <ram:Name>${xmlEsc(it.desc || `Position ${i + 1}`)}</ram:Name>
      </ram:SpecifiedTradeProduct>
      <ram:SpecifiedLineTradeAgreement>
        <ram:GrossPriceProductTradePrice>
          <ram:ChargeAmount>${f2(price)}</ram:ChargeAmount>
        </ram:GrossPriceProductTradePrice>
        <ram:NetPriceProductTradePrice>
          <ram:ChargeAmount>${f2(price)}</ram:ChargeAmount>
        </ram:NetPriceProductTradePrice>
      </ram:SpecifiedLineTradeAgreement>
      <ram:SpecifiedLineTradeDelivery>
        <ram:BilledQuantity unitCode="${unitCode(it.unit)}">${f2(qty)}</ram:BilledQuantity>
      </ram:SpecifiedLineTradeDelivery>
      <ram:SpecifiedLineTradeSettlement>
        <ram:ApplicableTradeTax>
          <ram:TypeCode>VAT</ram:TypeCode>
          <ram:CategoryCode>${catCode}</ram:CategoryCode>
          <ram:RateApplicablePercent>${f2(vatRate)}</ram:RateApplicablePercent>
        </ram:ApplicableTradeTax>
        <ram:SpecifiedTradeSettlementLineMonetarySummation>
          <ram:LineTotalAmount>${f2(lineTotal)}</ram:LineTotalAmount>
        </ram:SpecifiedTradeSettlementLineMonetarySummation>
      </ram:SpecifiedLineTradeSettlement>
    </ram:IncludedSupplyChainTradeLineItem>`;
  }).join("\n");

  const taxesXml = inv.ku ? `      <ram:ApplicableTradeTax>
        <ram:CalculatedAmount>0.00</ram:CalculatedAmount>
        <ram:TypeCode>VAT</ram:TypeCode>
        <ram:ExemptionReason>Gemäß § 19 UStG wird keine Umsatzsteuer berechnet.</ram:ExemptionReason>
        <ram:BasisAmount>${f2(t.net)}</ram:BasisAmount>
        <ram:CategoryCode>O</ram:CategoryCode>
        <ram:ExemptionReasonCode>VATEX-EU-19</ram:ExemptionReasonCode>
        <ram:RateApplicablePercent>0.00</ram:RateApplicablePercent>
      </ram:ApplicableTradeTax>` : Object.entries(t.byRate).map(([r, base]) => `      <ram:ApplicableTradeTax>
        <ram:CalculatedAmount>${f2(r2(base * Number(r) / 100))}</ram:CalculatedAmount>
        <ram:TypeCode>VAT</ram:TypeCode>
        <ram:BasisAmount>${f2(base)}</ram:BasisAmount>
        <ram:CategoryCode>${Number(r) > 0 ? "S" : "Z"}</ram:CategoryCode>
        <ram:RateApplicablePercent>${f2(r)}</ram:RateApplicablePercent>
      </ram:ApplicableTradeTax>`).join("\n");

  const ibanClean = (seller.iban || "").replace(/\s+/g, "").toUpperCase();

  return `<?xml version="1.0" encoding="UTF-8"?>
<rsm:CrossIndustryInvoice xmlns:rsm="urn:un:unece:uncefact:data:standard:CrossIndustryInvoice:100"
  xmlns:ccts="urn:un:unece:uncefact:documentation:standard:CoreComponentsTechnicalSpecification:2"
  xmlns:udt="urn:un:unece:uncefact:data:standard:UnqualifiedDataType:100"
  xmlns:qdt="urn:un:unece:uncefact:data:standard:QualifiedDataType:100"
  xmlns:ram="urn:un:unece:uncefact:data:standard:ReusableAggregateBusinessInformationEntity:100">
  <rsm:ExchangedDocumentContext>
    <ram:GuidelineSpecifiedDocumentContextParameter>
      <ram:ID>urn:cen.eu:en16931:2017#compliant#urn:factur-x.eu:1p0:en16931</ram:ID>
    </ram:GuidelineSpecifiedDocumentContextParameter>
  </rsm:ExchangedDocumentContext>
  <rsm:ExchangedDocument>
    <ram:ID>${xmlEsc(inv.number || "ENTWURF")}</ram:ID>
    <ram:TypeCode>${typeCode}</ram:TypeCode>
    <ram:IssueDateTime>
      <udt:DateTimeString format="102">${issueDate}</udt:DateTimeString>
    </ram:IssueDateTime>${notes.length ? `
    <ram:IncludedNote>
      <ram:Content>${xmlEsc(notes.join("\n"))}</ram:Content>
      <ram:SubjectCode>AAI</ram:SubjectCode>
    </ram:IncludedNote>` : ""}
  </rsm:ExchangedDocument>
  <rsm:SupplyChainTradeTransaction>
${itemsXml}
    <ram:ApplicableHeaderTradeAgreement>
      <ram:SellerTradeParty>
        <ram:Name>${xmlEsc(seller.name || "Verkäufer")}</ram:Name>${seller.owner ? `
        <ram:SpecifiedLegalOrganization>
          <ram:TradingBusinessName>${xmlEsc(seller.owner)}</ram:TradingBusinessName>
        </ram:SpecifiedLegalOrganization>` : ""}
        <ram:PostalTradeAddress>
          <ram:PostcodeCode>${xmlEsc(seller.zip || "")}</ram:PostcodeCode>

      </ram:SellerTradeParty>
      <ram:BuyerTradeParty>${buyer.customerNo ? `
        <ram:ID>${xmlEsc(buyer.customerNo)}</ram:ID>` : ""}
        <ram:Name>${xmlEsc(buyer.name)}</ram:Name>
        <ram:PostalTradeAddress>
          <ram:PostcodeCode>${xmlEsc(buyer.zip)}</ram:PostcodeCode>
          <ram:LineOne>${xmlEsc(buyer.street)}</ram:LineOne>
          <ram:CityName>${xmlEsc(buyer.city || "Ort")}</ram:CityName>
          <ram:CountryID>${xmlEsc(buyer.country || "DE")}</ram:CountryID>
        </ram:PostalTradeAddress>${buyer.vatId ? `

function attachFacturX(doc, xmlString) {

    : (typeof Buffer !== "undefined" ? Buffer.from(xmlString, "utf8") : new Uint8Array(0));

  let binaryStr = "";
  for (let i = 0; i < utf8Bytes.length; i++) binaryStr += String.fromCharCode(utf8Bytes[i]);
  const len = utf8Bytes.length;

  const xmp = `<?xpacket begin="" id="W5M0MpCehiHzreSzNTczkc9d"?>
<x:xmpmeta xmlns:x="adobe:ns:meta/">
  <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
    <rdf:Description rdf:about="" xmlns:pdfaid="http://www.aiim.org/pdfa/ns/id/">
      <pdfaid:part>3</pdfaid:part>
      <pdfaid:conformance>B</pdfaid:conformance>
    </rdf:Description>
    <rdf:Description rdf:about="" xmlns:zf="urn:factur-x:pdfa:CrossIndustryDocument:invoice:1p0#">
      <zf:DocumentType>INVOICE</zf:DocumentType>
      <zf:DocumentFileName>factur-x.xml</zf:DocumentFileName>
      <zf:Version>1.0</zf:Version>
      <zf:ConformanceLevel>EN 16931</zf:ConformanceLevel>
    </rdf:Description>
    <rdf:Description rdf:about="" xmlns:pdfaExtension="http://www.aiim.org/pdfa/ns/extension/" xmlns:pdfaSchema="http://www.aiim.org/pdfa/ns/schema#" xmlns:pdfaProperty="http://www.aiim.org/pdfa/ns/property#">
      <pdfaExtension:schemas>
        <rdf:Bag>
          <rdf:li rdf:parseType="Resource">
            <pdfaSchema:schema>Factur-X PDFA Extension Schema</pdfaSchema:schema>
            <pdfaSchema:namespaceURI>urn:factur-x:pdfa:CrossIndustryDocument:invoice:1p0#</pdfaSchema:namespaceURI>
            <pdfaSchema:prefix>zf</pdfaSchema:prefix>
            <pdfaSchema:property>
              <rdf:Seq>
                <rdf:li rdf:parseType="Resource">
                  <pdfaProperty:name>DocumentFileName</pdfaProperty:name>
                  <pdfaProperty:valueType>Text</pdfaProperty:valueType>
                  <pdfaProperty:category>external</pdfaProperty:category>
                  <pdfaProperty:description>The name of the embedded XML file</pdfaProperty:description>
                </rdf:li>
                <rdf:li rdf:parseType="Resource">
                  <pdfaProperty:name>DocumentType</pdfaProperty:name>
                  <pdfaProperty:valueType>Text</pdfaProperty:valueType>
                  <pdfaProperty:category>external</pdfaProperty:category>
                  <pdfaProperty:description>The type of the hybrid document</pdfaProperty:description>
                </rdf:li>
                <rdf:li rdf:parseType="Resource">
                  <pdfaProperty:name>Version</pdfaProperty:name>
                  <pdfaProperty:valueType>Text</pdfaProperty:valueType>
                  <pdfaProperty:category>external</pdfaProperty:category>
                  <pdfaProperty:description>The version of the Factur-X standard</pdfaProperty:description>
                </rdf:li>
                <rdf:li rdf:parseType="Resource">
                  <pdfaProperty:name>ConformanceLevel</pdfaProperty:name>
                  <pdfaProperty:valueType>Text</pdfaProperty:valueType>
                  <pdfaProperty:category>external</pdfaProperty:category>
                  <pdfaProperty:description>The conformance level of the embedded Factur-X data</pdfaProperty:description>
                </rdf:li>
              </rdf:Seq>
            </pdfaProperty:property>
          </rdf:li>
        </rdf:Bag>
      </pdfaExtension:schemas>
    </rdf:Description>
  </rdf:RDF>
</x:xmpmeta>
<?xpacket end="w"?>`;

  const xmpBytes = typeof TextEncoder !== "undefined"
    ? new TextEncoder().encode(xmp)
    : (typeof Buffer !== "undefined" ? Buffer.from(xmp, "utf8") : new Uint8Array(0));
  let xmpStr = "";
  for (let i = 0; i < xmpBytes.length; i++) xmpStr += String.fromCharCode(xmpBytes[i]);

  let fileObjId = null, fileSpecId = null, metaObjId = null;

  doc.internal.events.subscribe("putAdditionalObjects", function() {
    fileObjId = this.internal.newObject();
    this.internal.write(`<< /Type /EmbeddedFile /Subtype /text#2Fxml /Length ${len} /Params << /Size ${len} >> >>`);
    this.internal.write("stream");
    this.internal.write(binaryStr);
    this.internal.write("endstream");
    this.internal.write("endobj");

    fileSpecId = this.internal.newObject();
    this.internal.write(`<< /Type /Filespec /F (factur-x.xml) /UF (factur-x.xml) /EF << /F ${fileObjId} 0 R /UF ${fileObjId} 0 R >> /AFRelationship /Alternative /Desc (Factur-X/ZUGFeRD E-Invoice) >>`);
    this.internal.write("endobj");

    metaObjId = this.internal.newObject();
    this.internal.write(`<< /Type /Metadata /Subtype /XML /Length ${xmpBytes.length} >>`);
    this.internal.write("stream");
    this.internal.write(xmpStr);
    this.internal.write("endstream");
    this.internal.write("endobj");
  });

  doc.internal.events.subscribe("putCatalog", function() {
    if (metaObjId) this.internal.write(`/Metadata ${metaObjId} 0 R`);
    if (fileSpecId) {
      this.internal.write(`/AF [ ${fileSpecId} 0 R ]`);
      this.internal.write(`/Names << /EmbeddedFiles << /Names [ (factur-x.xml) ${fileSpecId} 0 R ] >> >>`);
    }
  });
}

/* ---------- E-Rechnungs-Import (Empfang) ---------- */
function parseEInvoiceXml(xmlText) {
  if (!xmlText) return null;
  const getTag = (xml, tag) => {
    const m = xml.match(new RegExp("<(?:[a-zA-Z0-9_-]+:)?" + tag + "[^>]*>([^<]+)<\\/", "i"));
    return m ? m[1].trim() : "";
  };
  if (xmlText.includes("CrossIndustryInvoice")) {
    const supplierMatch = xmlText.match(/<[^:]*:SellerTradeParty[\s\S]*?<[^:]*:Name[^>]*>([^<]+)<\//i);
    const party = supplierMatch ? supplierMatch[1].trim() : getTag(xmlText, "Name");
    let dateRaw = getTag(xmlText, "DateTimeString") || getTag(xmlText, "IssueDateTime");
    let date = "";
    if (dateRaw && dateRaw.length === 8 && /^\d{8}$/.test(dateRaw)) {
      date = dateRaw.slice(0, 4) + "-" + dateRaw.slice(4, 6) + "-" + dateRaw.slice(6, 8);
    }
    const idMatch = xmlText.match(/<[a-zA-Z0-9_-]*:?ExchangedDocument\b[\s\S]*?<[a-zA-Z0-9_-]*:?ID[^>]*>([^<]+)<\//i);
    const ref = idMatch ? idMatch[1].trim() : getTag(xmlText, "ID");
    const grossStr = getTag(xmlText, "DuePayableAmount") || getTag(xmlText, "GrandTotalAmount");
    const vatRateStr = getTag(xmlText, "RateApplicablePercent");
    return {
      party,
      date,
      ref,
      gross: grossStr ? parseFloat(grossStr) : null,
      vatRate: vatRateStr ? parseFloat(vatRateStr) : null,
      format: "ZUGFeRD/CII"
    };
  }
  if (xmlText.includes("Invoice") && (xmlText.includes("ubl") || xmlText.includes("urn:oasis:names"))) {
    const supplierMatch = xmlText.match(/<[^:]*:AccountingSupplierParty[\s\S]*?<[^:]*:PartyName[\s\S]*?<[^:]*:Name[^>]*>([^<]+)<\//i);
    const party = supplierMatch ? supplierMatch[1].trim() : getTag(xmlText, "Name");
    const date = getTag(xmlText, "IssueDate");
    const ref = getTag(xmlText, "ID");
    const grossStr = getTag(xmlText, "PayableAmount");
    const vatRateStr = getTag(xmlText, "Percent");
    return {
      party,
      date,
      ref,
      gross: grossStr ? parseFloat(grossStr) : null,
      vatRate: vatRateStr ? parseFloat(vatRateStr) : null,
      format: "XRechnung/UBL"
    };
  }
  return null;
}

async function extractEInvoiceFromPdf(arrayBuffer) {
  const bytes = new Uint8Array(arrayBuffer);
  const text = new TextDecoder("latin1").decode(bytes);
  const xmlStart = text.indexOf("<rsm:CrossIndustryInvoice");
  if (xmlStart !== -1) {
    const xmlEnd = text.indexOf("</rsm:CrossIndustryInvoice>", xmlStart);
    if (xmlEnd !== -1) {
      const xmlChunk = new TextDecoder("utf-8").decode(bytes.subarray(xmlStart, xmlEnd + 27));
      return parseEInvoiceXml(xmlChunk);
    }
  }
  const ublStart = text.indexOf("<Invoice");
  if (ublStart !== -1 && (text.includes("ubl") || text.includes("urn:oasis:names"))) {
    const ublEnd = text.indexOf("</Invoice>", ublStart);
    if (ublEnd !== -1) {
      const xmlChunk = new TextDecoder("utf-8").decode(bytes.subarray(ublStart, ublEnd + 10));
      return parseEInvoiceXml(xmlChunk);
    }
  }
  if (text.includes("/EmbeddedFile") && typeof DecompressionStream !== "undefined") {
    const efIdx = text.indexOf("/EmbeddedFile");
    const streamIdx = text.indexOf("stream", efIdx);
    if (streamIdx !== -1) {
      let start = streamIdx + 6;
      if (bytes[start] === 0x0d && bytes[start + 1] === 0x0a) start += 2;
      else if (bytes[start] === 0x0a) start += 1;
      const endStreamIdx = text.indexOf("endstream", start);
      if (endStreamIdx !== -1) {
        let end = endStreamIdx;
        if (bytes[end - 1] === 0x0a && bytes[end - 2] === 0x0d) end -= 2;
        else if (bytes[end - 1] === 0x0a) end -= 1;
        try {
          const ds = new DecompressionStream("deflate");
          const writer = ds.writable.getWriter();
          writer.write(bytes.subarray(start, end));
          writer.close();
          const reader = ds.readable.getReader();
          const chunks = [];
          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            chunks.push(value);
          }
          let totalLen = chunks.reduce((acc, c) => acc + c.length, 0);
          let merged = new Uint8Array(totalLen);
          let off = 0;
          for (const c of chunks) { merged.set(c, off); off += c.length; }
          const decompressed = new TextDecoder("utf-8").decode(merged);
          return parseEInvoiceXml(decompressed);
        } catch (e) {}
      }
    }
  }
  return null;
}

async function handleReceiptFileInput(input) {
  const file = input.files[0];
  if (!file) return;
  const container = $("#receipt-preview-container");
  if (container) {
    const objUrl = URL.createObjectURL(file);
    container.innerHTML = receiptPreviewHtml(objUrl, file.name);
  }
  const ext = (file.name.split(".").pop() || "").toLowerCase();
  let parsed = null;
  try {
    if (ext === "xml") {
      parsed = parseEInvoiceXml(await file.text());
    } else if (ext === "pdf") {
      parsed = await extractEInvoiceFromPdf(await file.arrayBuffer());
    }
  } catch (err) {
    console.warn("E-Rechnungs-Erkennung:", err);
  }
  if (parsed) {
    const f = input.form;
    if (parsed.party && !f.party.value) {
      f.party.value = parsed.party;
      const cat = lastCategory(new FormData(f).get("kind"), parsed.party);
      if (cat && f.category) f.category.value = cat;
    }
    if (parsed.date && !f.date.value) f.date.value = parsed.date;
    if (parsed.gross != null && (!f.gross.value || f.gross.value === "0,00")) f.gross.value = numIn(parsed.gross);
    if (parsed.ref && !f.ref.value) f.ref.value = parsed.ref;
    if (parsed.vatRate != null && f.vatRate) {
      const vr = Math.round(parsed.vatRate);
      if ([19, 7, 0].includes(vr)) f.vatRate.value = String(vr);
    }
    toast(`E-Rechnung erkannt (${parsed.format}): Daten von „${parsed.party || "Lieferant"}“ übernommen!`);
  }
}

    if (await saveDoc("invoices", sid, stor)) {

      await saveDoc("invoices", inv.id, { ...rest, status: "cancelled", cancelledBy: sid });
      toast(`Stornorechnung ${number} erstellt`); setTimeout(() => openInvoice(sid), 300);
    }
  });
}

/* ---------- export / import ---------- */
async function exportJson() {
  if (!downloads) return;
  const data = { app: "Kontobuch", version: 1, exportedAt: new Date().toISOString(), settings: S.settings, customers: S.customers, invoices: S.invoices, entries: S.entries };
  try { await downloads.save({ filename: `Kontobuch-Backup-${today()}.json`, data: JSON.stringify(data, null, 2) }); toast("Backup gespeichert"); }
  catch (e) { if (e?.code !== "declined") toast("Das Backup konnte nicht gespeichert werden.", true); }
}
async function exportCsv() {
  if (!downloads) return;
  const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const rows = journal(year).slice().reverse();
  const lines = [["Datum", "Art", "Belegnr.", "Partner", "Beschreibung", "Kategorie", "Brutto", "Netto", "USt/Vorsteuer", "Kennzahl EÜR", "Beleg vorhanden"].map(q).join(";")];
  rows.forEach(r => lines.push([fDate(r.date), r.kind === "in" ? "Einnahme" : "Ausgabe", r.ref, r.party, r.desc, r.src === "inv" ? "Rechnung" : CAT[r.category],
    num(r.gross), num(r.net), num(r.vat), r.kind === "in" ? (r.vat === 0 && r.ku ? "111" : "112") : (OUT_KZ[r.category] || "183"), r.src === "inv" ? "Rechnung" : r.receiptId ? "ja" : "nein"].map(q).join(";")));
  try { await downloads.save({ filename: `Kontobuch-Journal-${year}.csv`, data: "﻿" + lines.join("\r\n") }); toast("CSV gespeichert"); }
  catch (e) { if (e?.code !== "declined") toast("Die CSV-Datei konnte nicht gespeichert werden.", true); }
}
async function importJson(file) {
  let data;
  try { data = JSON.parse(await file.text()); } catch { toast("Die Datei ist kein gültiges Kontobuch-Backup.", true); return; }
  if (data?.app !== "Kontobuch" || !Array.isArray(data.invoices)) { toast("Die Datei ist kein gültiges Kontobuch-Backup.", true); return; }
  const n = (data.customers?.length || 0) + data.invoices.length + (data.entries?.length || 0);
  confirmBox("Backup einspielen?", `Das Backup vom ${fDate((data.exportedAt || "").slice(0, 10))} enthält ${n} Datensätze. Einträge mit gleicher Kennung werden überschrieben, alles andere bleibt erhalten.`, "Einspielen", async () => {
    let ok = true;
    if (data.settings && Object.keys(data.settings).length) ok = await saveSettings(data.settings);
    for (const coll of ["customers", "invoices", "entries"]) {
      for (const d of data[coll] || []) { if (!ok) break; const { id, ...rest } = d; if (id) ok = await guard(() => db.collection(coll).doc(id).set(rest)); }
    }
    if (ok) toast(`${n} Datensätze eingespielt`);
  }, false);
}

/* ---------- Kunden-Import (CSV, z. B. Export aus Papierkram) ---------- */
function parseCsv(text) {
  text = text.replace(/^\ufeff/, "");
  const sep = (text.split("\n")[0].match(/;/g) || []).length >= (text.split("\n")[0].match(/,/g) || []).length ? ";" : ",";
  const rows = []; let row = [], cell = "", quoted = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (quoted) {
      if (ch === '"' && text[i + 1] === '"') { cell += '"'; i++; }
      else if (ch === '"') quoted = false;
      else cell += ch;
    } else if (ch === '"') quoted = true;
    else if (ch === sep) { row.push(cell); cell = ""; }
    else if (ch === "\n" || ch === "\r") {
      if (ch === "\r" && text[i + 1] === "\n") i++;
      row.push(cell); cell = "";
      if (row.some(c => c.trim())) rows.push(row);
      row = [];
    } else cell += ch;
  }
  row.push(cell); if (row.some(c => c.trim())) rows.push(row);
  const head = (rows.shift() || []).map(h => h.trim());
  return rows.map(r => Object.fromEntries(head.map((h, i) => [h, (r[i] || "").trim()])));
}
function customersFromCsv(text, existing) {
  const pick = (r, ...keys) => keys.map(k => r[k]).find(v => v) || "";
  const taken = existing.map(c => c.customerNo);
  const names = new Set(existing.map(c => (c.name || "").toLowerCase()));
  const res = { add: [], skipped: 0, ignored: 0, suppliers: [] };
  for (const r of parseCsv(text)) {
    const name = pick(r, "Name", "Firma");
    if (!name) continue;
    if (r.Kontaktart && r.Kontaktart !== "Kunde") { res.ignored++; if (r.Kontaktart === "Lieferant") res.suppliers.push(name); continue; }
    let no = pick(r, "Kunden-/Lieferantennr.", "Kundennummer").replace(/^\D+/, "");
    if (names.has(name.toLowerCase()) || (no && taken.includes(no))) { res.skipped++; continue; }
    no = no || nextCustNo(taken);
    taken.push(no); names.add(name.toLowerCase());
    const country = pick(r, "Land (Post)", "Land");
    res.add.push({
      customerNo: no, name,
      contact: ["Anrede (Standardempfänger)", "Titel (Standardempfänger)", "Vorname (Standardempfänger)", "Nachname (Standardempfänger)"].map(k => r[k]).filter(Boolean).join(" "),
      street: pick(r, "Straße (Post)", "Straße (Haus)", "Straße"), zip: pick(r, "PLZ (Post)", "PLZ (Haus)", "PLZ"), city: pick(r, "Stadt (Post)", "Stadt (Haus)", "Ort", "Stadt"),
      country: country === "Deutschland" ? "" : country,
      email: pick(r, "E-Mail", "E-Mail (Standardempfänger)"), phone: pick(r, "Telefon", "Telefonnummer (Standardempfänger)", "Handynummer (Standardempfänger)"),
      vatId: pick(r, "UStID", "USt-IdNr."), note: [r.Notiz, r.Website].filter(Boolean).join("\n"),
    });
  }
  return res;
}
async function importCustomers(file) {
  const res = customersFromCsv(await file.text(), S.customers);
  const known = new Set((sett().suppliers || []).map(n => n.toLowerCase()));
  const sup = [...new Set(res.suppliers)].filter(n => !known.has(n.toLowerCase()));
  if (!res.add.length && !sup.length) { toast(`Nichts Neues in der Datei${res.skipped ? ` (${res.skipped} Kunden schon vorhanden)` : ""}.`, true); return; }
  const text = [res.add.length && `<b>${res.add.length} Kunden</b>: ${res.add.slice(0, 5).map(c => `${esc(c.customerNo)} ${esc(c.name)}`).join(", ")}${res.add.length > 5 ? ", …" : ""}`,
    sup.length && `<b>${sup.length} Lieferanten</b> als Vorschläge für Ausgaben: ${sup.slice(0, 5).map(esc).join(", ")}${sup.length > 5 ? ", …" : ""}`,
    res.skipped && `${res.skipped} Kunden sind schon vorhanden und werden übersprungen.`].filter(Boolean).join("<br><br>");
  confirmBox("CSV importieren?", text, "Importieren", async () => {
    let done = 0;
    for (const c of res.add) { if (!await saveDoc("customers", uid(), { ...c, createdAt: new Date().toISOString() })) break; done++; }
    if (done < res.add.length) return;
    if (sup.length && !await saveSettings({ suppliers: [...(sett().suppliers || []), ...sup] })) return;
    toast([done && `${done} Kunden`, sup.length && `${sup.length} Lieferanten`].filter(Boolean).join(" und ") + " importiert");
  }, false);
}

/* ---------- events ---------- */
const ACT = {
  close: () => closeModal(),
  nav: d => { view = d.v; lsSet("kb.view", view); history.replaceState(null, "", "#" + view); closeModal(); render(); window.scrollTo(0, 0); },
  "f-inv": d => { F.inv = d.v; render(); },
  "f-ent": d => { F.ent = d.v; render(); },
  "new-invoice": () => newInvoice(),
  "new-customer": () => customerForm(),
  "new-out": () => entryForm({ kind: "out", category: "sonstige" }),
  "new-in": () => entryForm({ kind: "in", category: "umsatz" }),
  "edit-customer": d => customerForm(S.customers.find(c => c.id === d.id)),
  "edit-entry": d => { const e = S.entries.find(x => x.id === d.id); if (e) entryForm(e); },
  "open-invoice": d => openInvoice(d.id),
  "mark-paid": d => markPaid(d.id),
  unpay: d => { const inv = S.invoices.find(i => i.id === d.id); confirmBox("Zahlung zurücknehmen?", `Rechnung ${esc(inv.number)} wird wieder als offen geführt.`, "Zurücknehmen",
    async () => { const { id, ...rest } = inv; await saveDoc("invoices", id, { ...rest, status: "open", paidDate: null }); }); },
  pdf: d => savePdf(S.invoices.find(i => i.id === d.id)),
  "pdf-open": d => openPdfInTab(S.invoices.find(i => i.id === d.id)),
  "view-receipt": d => openReceiptModal(d.id, d.name),
  xml: d => saveFacturXXml(S.invoices.find(i => i.id === d.id)),
  "dup-invoice": d => newInvoice(S.invoices.find(i => i.id === d.id)),
  "cancel-invoice": d => cancelInvoice(d.id),
  "del-invoice": d => confirmBox("Entwurf löschen?", "Der Entwurf hat noch keine Rechnungsnummer und wird endgültig gelöscht.", "Löschen", () => delDoc("invoices", d.id)),
  "del-customer": d => { const used = S.invoices.some(i => i.customerId === d.id);
    confirmBox("Kunde löschen?", used ? "Bestehende Rechnungen behalten die Anschrift, die beim Schreiben eingetragen war." : "Der Kunde wird endgültig gelöscht.", "Löschen", () => delDoc("customers", d.id)); },
  "del-entry": d => { const e = S.entries.find(x => x.id === d.id);
    confirmBox("Buchung löschen?", `Die Buchung${e?.receiptId ? " und ihr Beleg werden" : " wird"} endgültig gelöscht.`, "Löschen", async () => {
      if (await delDoc("entries", d.id) && e?.receiptId && assets) assets.delete(e.receiptId).catch(() => {}); }); },
  "item-add": () => { syncItems(); ed.items.push({ desc: "", qty: 1, unit: ed.items.at(-1)?.unit || "", price: "", vat: ed.items.at(-1)?.vat ?? 19 }); renderItems(); $(`#it-${ed.items.length - 1}-desc`)?.focus(); },
  "item-del": d => { syncItems(); ed.items.splice(Number(d.i), 1); renderItems(); },
  "inv-save-draft": () => saveDraft(),
  "export-json": () => exportJson(),
  "export-csv": () => exportCsv(),
};
function syncItems() {
  document.querySelectorAll("#items .item-row[data-i]").forEach(row => {
    const it = ed.items[Number(row.dataset.i)]; if (!it) return;
    row.querySelectorAll("[data-f]").forEach(inp => it[inp.dataset.f] = inp.value);
  });
}
document.addEventListener("click", e => {
  if (e.target.closest("[data-stop]")) return;
  if (e.target.id === "modal") { closeModal(); return; }
  const t = e.target.closest("[data-act]"); if (!t) return;
  const fn = ACT[t.dataset.act]; if (!fn) return;
  e.preventDefault(); fn(t.dataset, t);
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !$("#modal").hidden) closeModal();
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("tr.clickable")) { e.preventDefault(); e.target.click(); }
});
document.addEventListener("input", e => {
  if (e.target.id === "e-party") {
    const cat = lastCategory(new FormData(e.target.form).get("kind"), e.target.value);
    if (cat && $("#e-cat")) $("#e-cat").value = cat;
    return;
  }
  if (e.target.dataset.input === "search") { F.q = e.target.value; $("#ent-list").innerHTML = entriesRows(); return; }
  const row = e.target.closest("#items .item-row[data-i]");
  if (row && ed) {
    const it = ed.items[Number(row.dataset.i)]; it[e.target.dataset.f] = e.target.value;
    $("output", row).textContent = num(r2(parseNum(it.qty) * parseNum(it.price))); renderTotals();
  }
});
document.addEventListener("change", e => {
  const k = e.target.dataset.change;
  if (k === "year") { year = Number(e.target.value); render(); }
  if (k === "inv-cust" && ed) { const c = S.customers.find(x => x.id === e.target.value); if (c) $("#i-rec").value = recipientOf(c); }
  if (k === "entry-kind") {
    const f = e.target.form; const fd = new FormData(f); const id = f.dataset.id;
    const old = S.entries.find(x => x.id === id) || {};
    entryForm({ ...old, kind: fd.get("kind"), date: fd.get("date"), gross: fd.get("gross"), party: fd.get("party"), desc: fd.get("desc"), ref: fd.get("ref"),
      category: fd.get("kind") === "in" ? "umsatz" : "sonstige", vatRate: fd.get("vatRate") ?? old.vatRate });
  }
  if (k === "import" && e.target.files[0]) { importJson(e.target.files[0]); e.target.value = ""; }
  if (k === "import-customers" && e.target.files[0]) { importCustomers(e.target.files[0]); e.target.value = ""; }
  if (e.target.id === "e-file") handleReceiptFileInput(e.target);
  if (e.target.id === "e-rm") {
    const container = $("#receipt-preview-container");
    if (container) {
      if (e.target.checked) container.innerHTML = receiptPreviewHtml(null, null);
      else {
        const id = e.target.form?.dataset?.id;
        const old = S.entries.find(x => x.id === id);
        if (old?.receiptId) container.innerHTML = receiptPreviewHtml(`/_blob/${esc(old.receiptId)}`, old.receiptName || "Beleg");
      }
    }
  }
});
document.addEventListener("submit", async e => {
  const f = e.target; const kind = f.dataset.form; if (!kind) return;
  e.preventDefault();
  if (kind === "settings") {
    const fd = new FormData(f); const patch = {};
    for (const [k, v] of fd.entries()) patch[k] = typeof v === "string" ? v.trim() : v;
    patch.kleinunternehmer = $("#s-ku").checked;
    patch.nextInvoiceNo = Math.max(1, parseInt(patch.nextInvoiceNo, 10) || 1);
    patch.counterYear = new Date().getFullYear();
    patch.paymentDays = Math.max(0, parseInt(patch.paymentDays, 10) || 0);
    patch.iban = (patch.iban || "").replace(/\s+/g, "").replace(/(.{4})/g, "$1 ").trim().toUpperCase();
    const b = $("button[type=submit]", f); b.disabled = true;
    if (await saveSettings(patch)) toast("Einstellungen gespeichert");
    b.disabled = false;
  }
  if (kind === "customer") {
    const fd = new FormData(f); const id = f.dataset.id || uid();
    const data = Object.fromEntries([...fd.entries()].map(([k, v]) => [k, String(v).trim()]));
    if (!data.name || !data.customerNo) return;
    if (S.customers.some(c => c.id !== id && c.customerNo === data.customerNo)) { toast(`Die Kundennummer ${data.customerNo} ist schon vergeben.`, true); return; }
    const old = S.customers.find(c => c.id === id);
    if (await saveDoc("customers", id, { ...data, createdAt: old?.createdAt || new Date().toISOString() })) {
      closeModal(); toast("Kunde gespeichert");
    }
  }
  if (kind === "entry") submitEntry(f);
  if (kind === "invoice") { syncItems(); finalizeInvoice(); }
  if (kind === "paid") {
    const inv = S.invoices.find(i => i.id === f.dataset.id); const { id, ...rest } = inv;
    if (await saveDoc("invoices", id, { ...rest, status: "paid", paidDate: new FormData(f).get("paidDate") })) { closeModal(); toast(`Rechnung ${inv.number} als bezahlt gebucht`); }
  }
});

/* ---------- boot ---------- */
async function boot() {
  render();
  if (!window.claude?.use) { S.conn = "none"; render(); return; }
  db = await window.claude.use("db");
  if (!db) { S.conn = "none"; render(); return; }
  S.conn = "ok";
  window.claude.use("assets").then(a => { assets = a; }).catch(() => {});
  window.claude.use("downloads").then(d => { downloads = d; render(); }).catch(() => {});
  const onErr = err => { console.error(err); S.conn = "err"; render(); };
  db.doc("book/main").onSnapshot(snap => { S.settings = snap.exists ? { ...snap.data() } : {}; S.ready.settings = true; if (!$('form[data-form="settings"]') || !document.activeElement?.closest?.("form")) render(); else renderNav(); }, onErr);
  for (const c of ["customers", "invoices", "entries"]) {
    db.collection(c).onSnapshot(q => { S[c] = q.docs.map(d => ({ id: d.id, ...d.data() })); S.ready[c] = true; render(); }, onErr);
  }
}
boot();
