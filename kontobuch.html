  meta.push(["Format", "ZUGFeRD 2.2 / EN 16931"]);
  y = 57; doc.setFontSize(9);
  meta.forEach(([k, v]) => { gray(); doc.text(k, 125, y); black(); doc.text(String(v || ""), R, y, { align: "right" }); y += 5; });
  // Titel
  y = 100; doc.setFont("helvetica", "bold"); doc.setFontSize(14); doc.text(inv.storno ? "Stornorechnung" : "Rechnung", L, y);
  doc.setFont("helvetica", "normal"); doc.setFontSize(10); y += 8;
  const intro = inv.storno ? `Storno zu Rechnung ${inv.refNumber} vom ${fDate(inv.refDate)}.` : inv.intro;
  if (intro) { const lines = doc.splitTextToSize(intro, R - L); doc.text(lines, L, y); y += lines.length * 4.6 + 4; }
  // Tabelle
  const cols = inv.ku ? { pos: L, desc: L + 10, qty: 132, price: 160, total: R } : { pos: L, desc: L + 10, qty: 122, price: 148, vat: 162, total: R };
  const descW = (inv.ku ? 76 : 66);
  const head = () => {
    doc.setFontSize(8); gray();
    doc.text("Pos.", cols.pos, y); doc.text("Beschreibung", cols.desc, y); doc.text("Menge", cols.qty, y, { align: "right" });
    doc.text("Einzelpreis", cols.price, y, { align: "right" }); if (!inv.ku) doc.text("USt", cols.vat, y, { align: "right" }); doc.text("Gesamt", cols.total, y, { align: "right" });
    doc.setDrawColor(120); doc.line(L, y + 2, R, y + 2); y += 7; black(); doc.setFontSize(9.5);
  };
  head();
  inv.items.forEach((it, i) => {
    const lines = doc.splitTextToSize(it.desc || "", descW);
    if (y + lines.length * 4.4 > 262) { footer(); doc.addPage(); drawStationery(); y = 25; head(); }
    doc.text(String(i + 1), cols.pos, y); doc.text(lines, cols.desc, y);
    doc.text(`${String(it.qty).replace(".", ",")} ${it.unit || ""}`.trim(), cols.qty, y, { align: "right" });
    doc.text(eur(it.price), cols.price, y, { align: "right" }); if (!inv.ku) doc.text(`${it.vat} %`, cols.vat, y, { align: "right" });
    doc.text(eur(r2(it.qty * it.price)), cols.total, y, { align: "right" });
    y += lines.length * 4.4 + 2.6; doc.setDrawColor(225); doc.line(L, y - 3.2, R, y - 3.2);
  });
  // Summen
  if (y > 235) { footer(); doc.addPage(); drawStationery(); y = 25; }
  y += 2; const lx = 125;
  if (!inv.ku) {
    doc.text("Netto", lx, y); doc.text(eur(t.net), R, y, { align: "right" }); y += 5;
    Object.entries(t.byRate).filter(([r]) => Number(r)).forEach(([r, b]) => { doc.text(`USt ${r} %`, lx, y); doc.text(eur(r2(b * r / 100)), R, y, { align: "right" }); y += 5; });
  }
  doc.setDrawColor(20); doc.line(lx, y - 3.5, R, y - 3.5);
  doc.setFont("helvetica", "bold"); doc.text("Gesamtbetrag", lx, y + 1); doc.text(eur(t.gross), R, y + 1, { align: "right" });
  doc.line(lx, y + 3, R, y + 3); doc.line(lx, y + 3.8, R, y + 3.8);
  doc.setFont("helvetica", "normal"); y += 14;
  const tail = [];
  if (inv.ku) tail.push("Gemäß § 19 UStG wird keine Umsatzsteuer berechnet.");
  if (!inv.storno) tail.push(`Bitte überweisen Sie den Betrag bis zum ${fDate(inv.dueDate)}${s.iban ? " auf das unten genannte Konto" : ""} unter Angabe der Rechnungsnummer ${inv.number}.`);
  if (inv.notes) tail.push(inv.notes);
  tail.forEach(p => { const lines = doc.splitTextToSize(p, R - L); if (y + lines.length * 4.6 > 270) { footer(); doc.addPage(); drawStationery(); y = 25; } doc.text(lines, L, y); y += lines.length * 4.6 + 2; });
  if (s.closing) { y += 4; const lines = doc.splitTextToSize(`${s.closing}\n${s.owner || s.name}`, R - L); if (y + lines.length * 4.6 > 270) { footer(); doc.addPage(); drawStationery(); y = 25; } doc.text(lines, L, y); }
  footer();
  return doc.output(outputType);
}

function readQuoteForm() {
  const f = $('form[data-form="quote"]'); const fd = new FormData(f);
  const vDays = Number(fd.get("validDays") || 30);
  const qDate = fd.get("date");
  Object.assign(edQuote, {
    customerId: fd.get("customerId"),
    recipient: fd.get("recipient").trim(),
    date: qDate,
    validDays: vDays,
    validUntil: addDays(qDate, vDays),
    intro: fd.get("intro").trim(),
    notes: fd.get("notes").trim(),
    closing: fd.get("closing").trim()
  });
  edQuote.items = edQuote.items.map(it => ({
    desc: String(it.desc).trim(),
    qty: parseNum(it.qty),
    unit: String(it.unit || "").trim(),
    price: r2(parseNum(it.price)),
    vat: edQuote.ku ? 0 : Number(it.vat || 0)
  })).filter(it => it.desc || it.price);
  if (!edQuote.items.length) edQuote.items = [{ desc: "", qty: 1, unit: "", price: 0, vat: 19 }];
}

function quoteDoc(extra) {

    items: edQuote.items,

async function finalizeQuote() {
  readQuoteForm();
  if (!edQuote.recipient) { toast("Bitte gib einen Empfänger an.", true); return; }
  if (!edQuote.items.some(it => it.desc && it.price)) { toast("Mindestens eine Position braucht Beschreibung und Preis.", true); return; }
  if (edQuote.items.some(it => !it.desc)) { toast("Jede Position braucht eine Beschreibung.", true); return; }
  const s = sett();
  if (!s.name || !s.street) { toast("Trag zuerst Name und Anschrift in den Einstellungen ein.", true); return; }
  const { n, y, number } = nextQuote(yOf(edQuote.date));
  if ((S.quotes || []).some(q => q.number === number)) { toast(`Die Angebotsnummer ${number} gibt es schon.`, true); return; }
  const btn = $('form[data-form="quote"] button[type=submit]'); if (btn) btn.disabled = true;
  if (!await saveSettings({ nextQuoteNo: n + 1, quoteCounterYear: y })) { if (btn) btn.disabled = false; return; }
  const seller = Object.fromEntries(SELLER_FIELDS.map(k => [k, s[k] || ""])); seller.closing = s.quoteClosing || s.closing;
  const id = edQuote.id || uid();

    closeModal(); toast(`Angebot ${number} festgeschrieben`); openQuote(id);
  }
}

function quotePdf(q, outputType = "blob") {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "mm", format: "a4" });
  const s = q.seller || sett(); const t = calcInv(q);

  const L = 25, R = 190; let y;
  const gray = () => doc.setTextColor(110); const black = () => doc.setTextColor(20);

  const drawStationery = () => {
    if (s.stationeryData) {
      try {
        doc.addImage(s.stationeryData, 0, 0, 210, 297);
      } catch (err) {
        console.warn("Briefpapier konnte nicht eingefügt werden:", err);
      }
    }
  };

  const drawLogo = () => {
    if (!s.logoData) return null;
    try {
      const props = doc.getImageProperties(s.logoData);
      const maxW = 50, maxH = 22;
      const ratio = (props.width || 1) / (props.height || 1);
      let w = maxW, h = maxW / ratio;
      if (h > maxH) { h = maxH; w = maxH * ratio; }
      const x = R - w;
      const yPos = 12 + (maxH - h) / 2;
      doc.addImage(s.logoData, x, yPos, w, h);
      return { w, h, x, y: yPos };
    } catch (err) {
      console.warn("Logo konnte nicht eingefügt werden:", err);
      return null;
    }
  };

  drawStationery();

  const footer = () => {
    if (s.hideTextFooter) return;
    doc.setFontSize(7.5); gray(); doc.setDrawColor(200); doc.line(L, 278, R, 278);
    const parts = [s.name, [s.street, [s.zip, s.city].filter(Boolean).join(" ")].filter(Boolean).join(", "), s.taxNo && `Steuernr. ${s.taxNo}`, s.vatId && `USt-IdNr. ${s.vatId}`].filter(Boolean);
    const bank = [s.bank, s.iban && `IBAN ${s.iban}`, s.bic && `BIC ${s.bic}`].filter(Boolean);
    doc.text(parts.join("  ·  "), L, 283);
    if (bank.length) doc.text(bank.join("  ·  "), L, 287);
    black();
  };
  // Kopf
  const logoInfo = drawLogo();
  if (!s.hideTextHeader) {
    doc.setFont("helvetica", "bold"); doc.setFontSize(15); black(); doc.text(s.name || "", L, 22);
    doc.setFont("helvetica", "normal"); doc.setFontSize(8.5); gray();
    const contactLines = [s.owner, s.street, [s.zip, s.city].filter(Boolean).join(" "), s.email, s.phone, s.web].filter(Boolean);
    if (logoInfo) {
      doc.text(contactLines, R, Math.max(16, logoInfo.y + logoInfo.h + 3), { align: "right" });
    } else {
      doc.text(contactLines, R, 16, { align: "right" });
    }
  }
  // Anschriftfeld nach DIN 5008
  doc.setFontSize(7); doc.text([s.name, s.street, [s.zip, s.city].filter(Boolean).join(" ")].filter(Boolean).join(" · "), L, 50);
  doc.setDrawColor(170); doc.line(L, 51.2, L + 85, 51.2);
  black(); doc.setFontSize(10); doc.text(doc.splitTextToSize(q.recipient || "", 85).slice(0, 6), L, 57);
  // Infoblock
  const meta = [["Angebotsnr.", q.number], ...(q.customerNo ? [["Kundennr.", q.customerNo]] : []), ["Angebotsdatum", fDate(q.date)], ["Gültig bis", fDate(q.validUntil)]];
  y = 57; doc.setFontSize(9);
  meta.forEach(([k, v]) => { gray(); doc.text(k, 125, y); black(); doc.text(String(v || ""), R, y, { align: "right" }); y += 5; });
  // Titel
  y = 100; doc.setFont("helvetica", "bold"); doc.setFontSize(14); doc.text("Angebot", L, y);
  doc.setFont("helvetica", "normal"); doc.setFontSize(10); y += 8;
  const intro = q.intro;
  if (intro) { const lines = doc.splitTextToSize(intro, R - L); doc.text(lines, L, y); y += lines.length * 4.6 + 4; }
  // Tabelle
  const cols = q.ku ? { pos: L, desc: L + 10, qty: 132, price: 160, total: R } : { pos: L, desc: L + 10, qty: 122, price: 148, vat: 162, total: R };
  const descW = (q.ku ? 76 : 66);
  const head = () => {
    doc.setFontSize(8); gray();
    doc.text("Pos.", cols.pos, y); doc.text("Beschreibung", cols.desc, y); doc.text("Menge", cols.qty, y, { align: "right" });
    doc.text("Einzelpreis", cols.price, y, { align: "right" }); if (!q.ku) doc.text("USt", cols.vat, y, { align: "right" }); doc.text("Gesamt", cols.total, y, { align: "right" });
    doc.setDrawColor(120); doc.line(L, y + 2, R, y + 2); y += 7; black(); doc.setFontSize(9.5);
  };
  head();
  q.items.forEach((it, i) => {
    const lines = doc.splitTextToSize(it.desc || "", descW);
    if (y + lines.length * 4.4 > 262) { footer(); doc.addPage(); drawStationery(); y = 25; head(); }
    doc.text(String(i + 1), cols.pos, y); doc.text(lines, cols.desc, y);
    doc.text(`${String(it.qty).replace(".", ",")} ${it.unit || ""}`.trim(), cols.qty, y, { align: "right" });
    doc.text(eur(it.price), cols.price, y, { align: "right" }); if (!q.ku) doc.text(`${it.vat} %`, cols.vat, y, { align: "right" });
    doc.text(eur(r2(it.qty * it.price)), cols.total, y, { align: "right" });
    y += lines.length * 4.4 + 2.6; doc.setDrawColor(225); doc.line(L, y - 3.2, R, y - 3.2);
  });
  // Summen
  if (y > 235) { footer(); doc.addPage(); drawStationery(); y = 25; }
  y += 2; const lx = 125;
  if (!q.ku) {
    doc.text("Netto", lx, y); doc.text(eur(t.net), R, y, { align: "right" }); y += 5;
    Object.entries(t.byRate).filter(([r]) => Number(r)).forEach(([r, b]) => { doc.text(`USt ${r} %`, lx, y); doc.text(eur(r2(b * r / 100)), R, y, { align: "right" }); y += 5; });
  }
  doc.setDrawColor(20); doc.line(lx, y - 3.5, R, y - 3.5);
  doc.setFont("helvetica", "bold"); doc.text("Gesamtbetrag", lx, y + 1); doc.text(eur(t.gross), R, y + 1, { align: "right" });
  doc.line(lx, y + 3, R, y + 3); doc.line(lx, y + 3.8, R, y + 3.8);
  doc.setFont("helvetica", "normal"); y += 14;
  const tail = [];
  if (q.ku) tail.push("Gemäß § 19 UStG wird keine Umsatzsteuer berechnet.");
  if (q.validUntil) tail.push(`Dieses Angebot ist freibleibend gültig bis zum ${fDate(q.validUntil)}.`);
  if (q.notes) tail.push(q.notes);
  tail.forEach(p => { const lines = doc.splitTextToSize(p, R - L); if (y + lines.length * 4.6 > 270) { footer(); doc.addPage(); drawStationery(); y = 25; } doc.text(lines, L, y); y += lines.length * 4.6 + 2; });
  const closing = q.closing || s.quoteClosing || s.closing;
  if (closing) { y += 4; const lines = doc.splitTextToSize(`${closing}\n${s.owner || s.name}`, R - L); if (y + lines.length * 4.6 > 270) { footer(); doc.addPage(); drawStationery(); y = 25; } doc.text(lines, L, y); }
  footer();
  return doc.output(outputType);
}

async function saveQuotePdf(q) {
  if (!downloads || !window.jspdf) { toast("PDF-Download ist hier nicht verfügbar.", true); return; }
  try {
    const blob = quotePdf(q);
    const name = `Angebot_${q.number}.pdf`.replace(/[\/\\:*?"<>|]/g, "-");
    await downloads.save({ filename: name, data: blob }); toast("Angebot als PDF gespeichert");
  } catch (e) { if (e?.code !== "declined") { console.error(e); toast("Das PDF konnte nicht gespeichert werden.", true); } }
}

function openQuotePdfInTab(q) {
  if (!q) return;
  if (!window.jspdf) { toast("PDF-Vorschau nicht verfügbar.", true); return; }
  try {
    const blob = quotePdf(q);

    window.open(url, "_blank");
  } catch (err) {
    console.error(err);
    toast("PDF konnte nicht geöffnet werden.", true);
  }
}

function convertQuoteToInvoice(id) {
  const q = (S.quotes || []).find(x => x.id === id); if (!q) return;
  closeModal();
  const s = sett();
  ed = {
    id: null,
    status: "draft",
    customerId: q.customerId || "",

    intro: `Rechnung zu Angebot ${q.number} vom ${fDate(q.date)}.\n${s.intro}`,
    notes: q.notes || "",
    ku: q.ku != null ? q.ku : !!s.kleinunternehmer,
    refQuoteId: q.id,

  };
  invoiceEditor();

}

async function acceptQuote(id) {
  const q = (S.quotes || []).find(x => x.id === id); if (!q) return;
  const { id: _, ...rest } = q;
  if (await saveDoc("quotes", id, { ...rest, status: "accepted" })) {
    toast(`Angebot ${q.number} als angenommen markiert`);
    openQuote(id);
  }
}

async function rejectQuote(id) {
  const q = (S.quotes || []).find(x => x.id === id); if (!q) return;
  const { id: _, ...rest } = q;
  if (await saveDoc("quotes", id, { ...rest, status: "rejected" })) {
    toast(`Angebot ${q.number} als abgelehnt markiert`);
    openQuote(id);
  }
}

const CRC_TABLE = (() => {
  const table = new Uint32Array(256);
  for (let i = 0; i < 256; i++) {
    let c = i;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    table[i] = c >>> 0;
  }
  return table;
})();

function crc32(data) {
  let crc = 0xFFFFFFFF;
  for (let i = 0; i < data.length; i++) crc = (crc >>> 8) ^ CRC_TABLE[(crc ^ data[i]) & 0xFF];
  return (crc ^ 0xFFFFFFFF) >>> 0;
}

function createZip(files) {
  const encoder = new TextEncoder();
  const entries = files.map(f => {
    const nameBytes = encoder.encode(f.name);
    let dataBytes;
    if (typeof f.data === "string") {
      dataBytes = encoder.encode(f.data);
    } else if (f.data instanceof Uint8Array) {
      dataBytes = f.data;
    } else if (f.data instanceof ArrayBuffer) {
      dataBytes = new Uint8Array(f.data);
    } else {
      dataBytes = new Uint8Array(0);
    }
    return { name: f.name, nameBytes, dataBytes, crc: crc32(dataBytes), size: dataBytes.length, offset: 0 };
  });

  let localTotal = 0;
  for (const e of entries) localTotal += 30 + e.nameBytes.length + e.size;
  let cdTotal = 0;
  for (const e of entries) cdTotal += 46 + e.nameBytes.length;
  const total = localTotal + cdTotal + 22;

  const out = new Uint8Array(total);
  const view = new DataView(out.buffer);
  let pos = 0;

  const d = new Date();
  const dosTime = ((d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1)) & 0xFFFF;
  const dosDate = (((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate()) & 0xFFFF;

  for (const e of entries) {
    e.offset = pos;
    view.setUint32(pos, 0x04034b50, true); pos += 4;
    view.setUint16(pos, 20, true); pos += 2;
    view.setUint16(pos, 0x0800, true); pos += 2; // UTF-8 (bit 11)
    view.setUint16(pos, 0, true); pos += 2;      // Method: 0 (Store)
    view.setUint16(pos, dosTime, true); pos += 2;
    view.setUint16(pos, dosDate, true); pos += 2;
    view.setUint32(pos, e.crc, true); pos += 4;
    view.setUint32(pos, e.size, true); pos += 4;
    view.setUint32(pos, e.size, true); pos += 4;
    view.setUint16(pos, e.nameBytes.length, true); pos += 2;
    view.setUint16(pos, 0, true); pos += 2;
    out.set(e.nameBytes, pos); pos += e.nameBytes.length;
    out.set(e.dataBytes, pos); pos += e.size;
  }

  const cdOffset = pos;
  for (const e of entries) {
    const isDir = e.name.endsWith("/");
    view.setUint32(pos, 0x02014b50, true); pos += 4;
    view.setUint16(pos, 20, true); pos += 2;
    view.setUint16(pos, 20, true); pos += 2;
    view.setUint16(pos, 0x0800, true); pos += 2;
    view.setUint16(pos, 0, true); pos += 2;
    view.setUint16(pos, dosTime, true); pos += 2;
    view.setUint16(pos, dosDate, true); pos += 2;
    view.setUint32(pos, e.crc, true); pos += 4;
    view.setUint32(pos, e.size, true); pos += 4;
    view.setUint32(pos, e.size, true); pos += 4;
    view.setUint16(pos, e.nameBytes.length, true); pos += 2; // file name length
    view.setUint16(pos, 0, true); pos += 2;                  // extra field length
    view.setUint16(pos, 0, true); pos += 2;                  // file comment length
    view.setUint16(pos, 0, true); pos += 2;                  // disk number start
    view.setUint16(pos, 0, true); pos += 2;                  // internal file attributes
    view.setUint32(pos, isDir ? 0x10 : 0, true); pos += 4;  // external file attributes
    view.setUint32(pos, e.offset, true); pos += 4;          // relative offset of local header
    out.set(e.nameBytes, pos); pos += e.nameBytes.length;
  }
  const cdSize = pos - cdOffset;

  view.setUint32(pos, 0x06054b50, true); pos += 4;
  view.setUint16(pos, 0, true); pos += 2;
  view.setUint16(pos, 0, true); pos += 2;
  view.setUint16(pos, entries.length, true); pos += 2;
  view.setUint16(pos, entries.length, true); pos += 2;
  view.setUint32(pos, cdSize, true); pos += 4;
  view.setUint32(pos, cdOffset, true); pos += 4;
  view.setUint16(pos, 0, true); pos += 2;

  return out;
}

async function fetchBlob(receiptId) {
  if (!receiptId) return null;
  try {
    const res = await fetch("/_blob/" + encodeURIComponent(receiptId));
    if (res.ok) {
      const ct = (res.headers.get("Content-Type") || "").toLowerCase();
      const ext = ct.includes("pdf") ? ".pdf" : ct.includes("png") ? ".png" : ct.includes("jpeg") || ct.includes("jpg") ? ".jpg" : ct.includes("webp") ? ".webp" : "";
      const ab = await res.arrayBuffer();
      return { bytes: new Uint8Array(ab), ext };
    }
  } catch (err) {
    console.warn("Beleg-Abruf fehlgeschlagen:", receiptId, err);
  }
  return null;
}

async function exportYearZip(y = year) {
  if (!downloads) {
    toast("Download ist hier nicht verfügbar.", true);
    return;
  }
  toast(`Jahresabschluss ${y} wird erstellt …`);

  try {
    const s = sett();
    const files = [];
    const usedZipNames = new Set();
    const sanitize = n => String(n || "").replace(/[\/\\:*?"<>|]/g, "_").trim();

    function addFile(path, data) {
      let uniquePath = path;
      if (usedZipNames.has(uniquePath)) {
        const parts = path.split(".");
        const ext = parts.length > 1 ? "." + parts.pop() : "";
        const base = parts.join(".");
        let c = 2;
        while (usedZipNames.has(`${base}_${c}${ext}`)) c++;
        uniquePath = `${base}_${c}${ext}`;
      }
      usedZipNames.add(uniquePath);
      files.push({ name: uniquePath, data });
      return uniquePath;
    }

    // 1. Journal CSV
    files.push({ name: `Journal-${y}.csv`, data: generateJournalCsv(y) });

    // 2. Anlagenverzeichnis CSV
    files.push({ name: `Anlagenverzeichnis-${y}.csv`, data: generateAssetsCsv(y) });

    // 3. EÜR-Bericht TXT
    files.push({ name: `EÜR-Bericht-${y}.txt`, data: generateEuerReport(y) });

    // Filter year records
    const yearInvoices = S.invoices.filter(i => i.number && (yOf(i.date) === y || yOf(i.paidDate) === y));
    const yearQuotes = (S.quotes || []).filter(q => q.number && yOf(q.date) === y);
    const yearEntries = S.entries.filter(ent => yOf(ent.date) === y);
    const yearAssets = (S.fixedAssets || []).filter(a => {
      const c = calcAsset(a, y);
      return (c && (c.additions > 0 || c.afa > 0)) || yOf(a.date) === y;
    });

    // 4. Datenbestand JSON
    const snapshot = {
      app: "Kontobuch",
      version: 1,
      year: y,
      exportedAt: new Date().toISOString(),
      settings: s,
      customers: S.customers,
      quotes: yearQuotes,
      invoices: yearInvoices,
      entries: yearEntries,
      fixedAssets: S.fixedAssets || []
    };
    files.push({ name: `Datenbestand-${y}.json`, data: JSON.stringify(snapshot, null, 2) });

    // 5. Ausgangsrechnungen als ZUGFeRD 2.2 PDFs
    if (!yearInvoices.length) {
      files.push({ name: "Ausgangsrechnungen/", data: "" });
    } else {
      for (const inv of yearInvoices) {
        try {
          const pdfBytes = new Uint8Array(invoicePdf(inv, "arraybuffer"));
          const prefix = inv.storno ? "Stornorechnung" : "Rechnung";
          const fname = sanitize(`${prefix}_${inv.number}.pdf`);
          addFile(`Ausgangsrechnungen/${fname}`, pdfBytes);
        } catch (err) {
          console.warn(`Fehler bei PDF-Erstellung für ${inv.number}:`, err);
        }
      }
    }

    // Angebote als PDFs
    if (yearQuotes.length) {
      for (const q of yearQuotes) {
        try {
          const pdfBytes = new Uint8Array(quotePdf(q, "arraybuffer"));
          const fname = sanitize(`Angebot_${q.number}.pdf`);
          addFile(`Angebote/${fname}`, pdfBytes);
        } catch (err) {
          console.warn(`Fehler bei PDF-Erstellung für Angebot ${q.number}:`, err);
        }
      }
    }

    // 6. Eingangsbelege herunterladen
    let fetchedReceiptsCount = 0;
    const receiptsToFetch = [];

    for (const ent of yearEntries) {
      if (ent.receiptId) {
        receiptsToFetch.push({
          id: ent.receiptId,
          suggestedName: ent.receiptName || `${ent.date || y}_${sanitize(ent.party || "Beleg")}.pdf`
        });
      }
    }
    for (const asset of yearAssets) {
      if (asset.receiptId) {
        receiptsToFetch.push({
          id: asset.receiptId,
          suggestedName: asset.receiptName || `Anlage_${asset.date || y}_${sanitize(asset.name || "Kaufbeleg")}.pdf`
        });
      }
    }

    if (!receiptsToFetch.length) {
      files.push({ name: "Eingangsbelege/", data: "" });
    } else {
      for (const item of receiptsToFetch) {
        const blobRes = await fetchBlob(item.id);
        if (blobRes) {
          let name = item.suggestedName;
          if (!/\.[a-zA-Z0-9]{3,4}$/.test(name) && blobRes.ext) {
            name += blobRes.ext;
          }
          const clean = sanitize(name);
          addFile(`Eingangsbelege/${clean}`, blobRes.bytes);
          fetchedReceiptsCount++;
        }
      }
    }

    // 7. README-Abschluss-[JAHR].txt
    const readme = generateReadmeReport(y, {
      invoicesCount: yearInvoices.length,
      quotesCount: yearQuotes.length,
      entriesCount: yearEntries.length,
      receiptsTotal: receiptsToFetch.length,
      receiptsSaved: fetchedReceiptsCount
    });
    files.unshift({ name: `README-Abschluss-${y}.txt`, data: readme });

    // Pack into ZIP
    const zipBytes = createZip(files);
    const blob = new Blob([zipBytes], { type: "application/zip" });
    const filename = `Kontobuch-Abschluss-${y}.zip`;

    await downloads.save({ filename, data: blob });
    toast(`Jahresabschluss ${y} (ZIP) erfolgreich gespeichert`);
  } catch (err) {
    if (err?.code !== "declined") {
      console.error(err);
      toast("Der Jahresabschluss konnte nicht gespeichert werden.", true);
    }
  }
}

/* ---------- Kunden-Import (CSV, z. B. Export aus Papierkram) ---------- */
function parseCsv(text) {
  text = text.replace(/^\ufeff/, "");
  const sep = (text.split("\n")[0].match(/;/g) || []).length >= (text.split("\n")[0].match(/,/g) || []).length ? ";" : ",";
  const rows = []; let row = [], cell = "", quoted = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (quoted) {
      if (ch === '"' && text[i + 1] === '"') { cell += '"'; i++; }
      else if (ch === '"') quoted = false;
      else cell += ch;
    } else if (ch === '"') quoted = true;
    else if (ch === sep) { row.push(cell); cell = ""; }
    else if (ch === "\n" || ch === "\r") {
      if (ch === "\r" && text[i + 1] === "\n") i++;
      row.push(cell); cell = "";
      if (row.some(c => c.trim())) rows.push(row);
      row = [];
    } else cell += ch;
  }
  row.push(cell); if (row.some(c => c.trim())) rows.push(row);
  const head = (rows.shift() || []).map(h => h.trim());
  return rows.map(r => Object.fromEntries(head.map((h, i) => [h, (r[i] || "").trim()])));
}
function customersFromCsv(text, existing) {
  const pick = (r, ...keys) => keys.map(k => r[k]).find(v => v) || "";
  const taken = existing.map(c => c.customerNo);
  const names = new Set(existing.map(c => (c.name || "").toLowerCase()));
  const res = { add: [], skipped: 0, ignored: 0, suppliers: [] };
  for (const r of parseCsv(text)) {
    const name = pick(r, "Name", "Firma");
    if (!name) continue;
    if (r.Kontaktart && r.Kontaktart !== "Kunde") { res.ignored++; if (r.Kontaktart === "Lieferant") res.suppliers.push(name); continue; }
    let no = pick(r, "Kunden-/Lieferantennr.", "Kundennummer").replace(/^\D+/, "");
    if (names.has(name.toLowerCase()) || (no && taken.includes(no))) { res.skipped++; continue; }
    no = no || nextCustNo(taken);
    taken.push(no); names.add(name.toLowerCase());
    const country = pick(r, "Land (Post)", "Land");
    res.add.push({
      customerNo: no, name,
      contact: ["Anrede (Standardempfänger)", "Titel (Standardempfänger)", "Vorname (Standardempfänger)", "Nachname (Standardempfänger)"].map(k => r[k]).filter(Boolean).join(" "),
      street: pick(r, "Straße (Post)", "Straße (Haus)", "Straße"), zip: pick(r, "PLZ (Post)", "PLZ (Haus)", "PLZ"), city: pick(r, "Stadt (Post)", "Stadt (Haus)", "Ort", "Stadt"),
      country: country === "Deutschland" ? "" : country,
      email: pick(r, "E-Mail", "E-Mail (Standardempfänger)"), phone: pick(r, "Telefon", "Telefonnummer (Standardempfänger)", "Handynummer (Standardempfänger)"),
      vatId: pick(r, "UStID", "USt-IdNr."), note: [r.Notiz, r.Website].filter(Boolean).join("\n"),
    });
  }
  return res;
}
async function importCustomers(file) {
  const res = customersFromCsv(await file.text(), S.customers);
  const known = new Set((sett().suppliers || []).map(n => n.toLowerCase()));
  const sup = [...new Set(res.suppliers)].filter(n => !known.has(n.toLowerCase()));
  if (!res.add.length && !sup.length) { toast(`Nichts Neues in der Datei${res.skipped ? ` (${res.skipped} Kunden schon vorhanden)` : ""}.`, true); return; }
  const text = [res.add.length && `<b>${res.add.length} Kunden</b>: ${res.add.slice(0, 5).map(c => `${esc(c.customerNo)} ${esc(c.name)}`).join(", ")}${res.add.length > 5 ? ", …" : ""}`,
    sup.length && `<b>${sup.length} Lieferanten</b> als Vorschläge für Ausgaben: ${sup.slice(0, 5).map(esc).join(", ")}${sup.length > 5 ? ", …" : ""}`,
    res.skipped && `${res.skipped} Kunden sind schon vorhanden und werden übersprungen.`].filter(Boolean).join("<br><br>");
  confirmBox("CSV importieren?", text, "Importieren", async () => {
    let done = 0;
    for (const c of res.add) { if (!await saveDoc("customers", uid(), { ...c, createdAt: new Date().toISOString() })) break; done++; }
    if (done < res.add.length) return;
    if (sup.length && !await saveSettings({ suppliers: [...(sett().suppliers || []), ...sup] })) return;
    toast([done && `${done} Kunden`, sup.length && `${sup.length} Lieferanten`].filter(Boolean).join(" und ") + " importiert");
  }, false);
}

  "quote-item-del": d => { modalDirty = true; syncQuoteItems(); edQuote.items.splice(Number(d.qi), 1); renderQuoteItems(); },
  "quote-item-move": d => {
    syncQuoteItems();
    const idx = Number(d.qi), dir = Number(d.dir);
    if (moveArrayItem(edQuote.items, idx, dir)) {
      modalDirty = true;
      renderQuoteItems();
      $(`#qit-${idx + dir}-desc`)?.focus();
    }
  },
  "inv-save-draft": () => saveDraft(),
  "quote-save-draft": () => saveQuoteDraft(),
  "export-json": () => exportJson(),
  "export-csv": () => exportCsv(),
  "export-year-zip": () => exportYearZip(year),
  "export-year-zip-explicit": d => exportYearZip(Number(d.year)),
  "dismiss-reminder": async d => {
    const s = sett();
    const dismissed = { ...(s.dismissedReminders || {}), [d.year]: true };
    await saveSettings({ dismissedReminders: dismissed });
    toast(`Erinnerung für ${d.year} ausgeblendet`);
    render();
  },
};
function syncItems() {
  document.querySelectorAll("#items .item-row[data-i]").forEach(row => {
    const it = ed.items[Number(row.dataset.i)]; if (!it) return;
    row.querySelectorAll("[data-f]").forEach(inp => it[inp.dataset.f] = inp.value);
  });
}
window.addEventListener("beforeunload", e => {
  if (modalDirty) { e.preventDefault(); e.returnValue = ""; }
});
document.addEventListener("click", e => {
  if (e.target.closest("[data-stop]")) return;
  if (e.target.id === "modal") { closeModal(false); return; }
  const t = e.target.closest("[data-act]"); if (!t) return;
  const fn = ACT[t.dataset.act]; if (!fn) return;
  e.preventDefault(); fn(t.dataset, t);
});
document.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "s") {
    if (!$("#modal").hidden) {
      const f = $("#modal form");
      if (f) {
        e.preventDefault();
        if (f.dataset.form === "invoice") { syncItems(); saveDraft(); }
        else if (f.dataset.form === "quote") { syncQuoteItems(); saveQuoteDraft(); }
        else f.requestSubmit();
      }
      return;
    }
    const sf = $('form[data-form="settings"]');
    if (sf) { e.preventDefault(); sf.requestSubmit(); return; }
  }
  if (e.altKey && e.key.toLowerCase() === "n" && !$("#modal").hidden) {
    if ($('form[data-form="invoice"]')) { e.preventDefault(); ACT["item-add"](); return; }
    if ($('form[data-form="quote"]')) { e.preventDefault(); ACT["quote-item-add"](); return; }
  }
  if (e.key === "Escape" && !$("#modal").hidden) closeModal(false);
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("tr.clickable")) { e.preventDefault(); e.target.click(); }
});
document.addEventListener("input", e => {
  if (e.target.closest("#modal form")) modalDirty = true;
  if (e.target.id === "e-party") {
    const cat = lastCategory(new FormData(e.target.form).get("kind"), e.target.value);
    if (cat && $("#e-cat")) $("#e-cat").value = cat;
    return;
  }
  if (e.target.dataset.input === "search") { F.q = e.target.value; $("#ent-list").innerHTML = entriesRows(); return; }
  const row = e.target.closest("#items .item-row[data-i]");
  if (row && ed) {
    const it = ed.items[Number(row.dataset.i)];
    const field = e.target.dataset.f;
    it[field] = e.target.value;
    if (field === "desc") {
      const tpl = itemTemplates().find(t => t.desc.toLowerCase() === e.target.value.trim().toLowerCase());
      if (tpl && (!it.price || Number(parseNum(it.price)) === 0)) {
        it.unit = tpl.unit || it.unit;
        it.price = tpl.price;
        if (!ed.ku && tpl.vat != null) it.vat = tpl.vat;
        const uInp = $('[data-f="unit"]', row); if (uInp) uInp.value = it.unit;
        const pInp = $('[data-f="price"]', row); if (pInp) pInp.value = numIn(it.price);
        const vSel = $('[data-f="vat"]', row); if (vSel) vSel.value = String(it.vat);
      }
    }
    $("output", row).textContent = num(r2(parseNum(it.qty) * parseNum(it.price))); renderTotals();
  }
  const qrow = e.target.closest("#quote-items .item-row[data-qi]");
  if (qrow && edQuote) {
    const it = edQuote.items[Number(qrow.dataset.qi)];
    const field = e.target.dataset.qf;
    it[field] = e.target.value;
    if (field === "desc") {
      const tpl = itemTemplates().find(t => t.desc.toLowerCase() === e.target.value.trim().toLowerCase());
      if (tpl && (!it.price || Number(parseNum(it.price)) === 0)) {
        it.unit = tpl.unit || it.unit;
        it.price = tpl.price;
        if (!edQuote.ku && tpl.vat != null) it.vat = tpl.vat;
        const uInp = $('[data-qf="unit"]', qrow); if (uInp) uInp.value = it.unit;
        const pInp = $('[data-qf="price"]', qrow); if (pInp) pInp.value = numIn(it.price);
        const vSel = $('[data-qf="vat"]', qrow); if (vSel) vSel.value = String(it.vat);
      }
    }
    $("[data-qline]", qrow).textContent = num(r2(parseNum(it.qty) * parseNum(it.price))); renderQuoteTotals();
  }
});
document.addEventListener("change", e => {
  if (e.target.closest("#modal form")) modalDirty = true;
  const k = e.target.dataset.change;
  if (k === "year") { year = Number(e.target.value); render(); }
  if (k === "period") { period = e.target.value; render(); }
  if (k === "inv-cust" && ed) { const c = S.customers.find(x => x.id === e.target.value); if (c) $("#i-rec").value = recipientOf(c); }
  if (k === "quote-cust" && edQuote) { const c = S.customers.find(x => x.id === e.target.value); if (c) $("#q-rec").value = recipientOf(c); }
  if (k === "entry-kind") {
    const f = e.target.form; const fd = new FormData(f); const id = f.dataset.id;
    const old = S.entries.find(x => x.id === id) || {};
    entryForm({ ...old, kind: fd.get("kind"), date: fd.get("date"), gross: fd.get("gross"), party: fd.get("party"), desc: fd.get("desc"), ref: fd.get("ref"),
      category: fd.get("kind") === "in" ? "umsatz" : "sonstige", vatRate: fd.get("vatRate") ?? old.vatRate });
  }
  if (k === "import" && e.target.files[0]) { importJson(e.target.files[0]); e.target.value = ""; }
  if (k === "import-customers" && e.target.files[0]) { importCustomers(e.target.files[0]); e.target.value = ""; }
  if (e.target.id === "e-file") handleReceiptFileInput(e.target);
  if (e.target.id === "s-logo-file") handleLogoFileInput(e.target);
  if (e.target.id === "s-stationery-file") handleStationeryFileInput(e.target);
  if (e.target.id === "e-rm") {
    const container = $("#receipt-preview-container");
    if (container) {
      if (e.target.checked) container.innerHTML = receiptPreviewHtml(null, null);
      else {
        const id = e.target.form?.dataset?.id;
        const old = S.entries.find(x => x.id === id);
        if (old?.receiptId) container.innerHTML = receiptPreviewHtml(`/_blob/${esc(old.receiptId)}`, old.receiptName || "Beleg");
      }
    }
  }
  if (e.target.id === "a-file") {
    const file = e.target.files[0];
    if (file) {
      const container = $("#asset-preview-container");
      if (container) container.innerHTML = receiptPreviewHtml(URL.createObjectURL(file), file.name);
    }
  }
  if (e.target.id === "a-rm") {
    const container = $("#asset-preview-container");
    if (container) {
      if (e.target.checked) container.innerHTML = receiptPreviewHtml(null, null);
      else {
        const id = e.target.form?.dataset?.id;
        const old = (S.fixedAssets || []).find(x => x.id === id);
        if (old?.receiptId) container.innerHTML = receiptPreviewHtml(`/_blob/${esc(old.receiptId)}`, old.receiptName || "Kaufbeleg");
      }
    }
  }
});
document.addEventListener("submit", async e => {
  const f = e.target; const kind = f.dataset.form; if (!kind) return;
  e.preventDefault();
  if (kind === "settings") {
    const fd = new FormData(f); const patch = {};
    for (const [k, v] of fd.entries()) patch[k] = typeof v === "string" ? v.trim() : v;
    patch.kleinunternehmer = $("#s-ku").checked;
    patch.hideTextHeader = $("#s-hide-header") ? $("#s-hide-header").checked : false;
    patch.hideTextFooter = $("#s-hide-footer") ? $("#s-hide-footer").checked : false;
    patch.logoData = $("#s-logoData") ? $("#s-logoData").value : (sett().logoData || "");
    patch.logoName = $("#s-logoName") ? $("#s-logoName").value : (sett().logoName || "");
    patch.stationeryData = $("#s-stationeryData") ? $("#s-stationeryData").value : (sett().stationeryData || "");
    patch.stationeryName = $("#s-stationeryName") ? $("#s-stationeryName").value : (sett().stationeryName || "");

    const b = $("button[type=submit]", f); b.disabled = true;
    const logoFile = $("#s-logo-file")?.files?.[0];
    if (logoFile && assets) {
      try {
        const up = await assets.upload(logoFile, { type: logoFile.type || "image/png" });
        if (sett().logoFileId && sett().logoFileId !== up.id) assets.delete(sett().logoFileId).catch(() => {});
        patch.logoFileId = up.id;
      } catch (err) {
        console.warn("Logo-Upload in Assets:", err);
      }
    } else if (!patch.logoData && sett().logoFileId && assets) {
      assets.delete(sett().logoFileId).catch(() => {});
      patch.logoFileId = null;
    }

    const stFile = $("#s-stationery-file")?.files?.[0];
    if (stFile && assets) {
      try {
        const up = await assets.upload(stFile, { type: stFile.type || "image/png" });
        if (sett().stationeryFileId && sett().stationeryFileId !== up.id) assets.delete(sett().stationeryFileId).catch(() => {});
        patch.stationeryFileId = up.id;
      } catch (err) {
        console.warn("Briefpapier-Upload in Assets:", err);
      }
    } else if (!patch.stationeryData && sett().stationeryFileId && assets) {
      assets.delete(sett().stationeryFileId).catch(() => {});
      patch.stationeryFileId = null;
    }

    patch.nextInvoiceNo = Math.max(1, parseInt(patch.nextInvoiceNo, 10) || 1);
    patch.nextQuoteNo = Math.max(1, parseInt(patch.nextQuoteNo, 10) || 1);
    patch.quoteValidityDays = Math.max(1, parseInt(patch.quoteValidityDays, 10) || 30);
    patch.counterYear = new Date().getFullYear();
    patch.quoteCounterYear = new Date().getFullYear();
    patch.paymentDays = Math.max(0, parseInt(patch.paymentDays, 10) || 0);
    patch.iban = (patch.iban || "").replace(/\s+/g, "").replace(/(.{4})/g, "$1 ").trim().toUpperCase();
    if (await saveSettings(patch)) { toast("Einstellungen gespeichert"); render(); }
    b.disabled = false;
  }
  if (kind === "customer") {
    const fd = new FormData(f); const id = f.dataset.id || uid();
    const data = Object.fromEntries([...fd.entries()].map(([k, v]) => [k, String(v).trim()]));
    if (!data.name || !data.customerNo) return;
    if (S.customers.some(c => c.id !== id && c.customerNo === data.customerNo)) { toast(`Die Kundennummer ${data.customerNo} ist schon vergeben.`, true); return; }
    const old = S.customers.find(c => c.id === id);
    if (await saveDoc("customers", id, { ...data, createdAt: old?.createdAt || new Date().toISOString() })) {
      closeModal(); toast("Kunde gespeichert");
    }
  }
  if (kind === "asset") submitAsset(f);
  if (kind === "entry") submitEntry(f);
  if (kind === "invoice") { syncItems(); finalizeInvoice(); }
  if (kind === "quote") { syncQuoteItems(); finalizeQuote(); }
  if (kind === "paid") {
    const inv = S.invoices.find(i => i.id === f.dataset.id); const { id, ...rest } = inv;
    if (await saveDoc("invoices", id, { ...rest, status: "paid", paidDate: new FormData(f).get("paidDate") })) { closeModal(); toast(`Rechnung ${inv.number} als bezahlt gebucht`); }
  }
});

/* ---------- boot ---------- */
async function boot() {
  const savedTheme = lsGet("kb.theme");
  if (savedTheme) document.documentElement.setAttribute("data-theme", savedTheme);
  render();
  if (!window.claude?.use) { S.conn = "none"; render(); return; }
  db = await window.claude.use("db");
  if (!db) { S.conn = "none"; render(); return; }
  S.conn = "ok";
  window.claude.use("assets").then(a => { assets = a; }).catch(() => {});
  window.claude.use("downloads").then(d => { downloads = d; render(); }).catch(() => {});
  const onErr = err => { console.error(err); S.conn = "err"; render(); };
  db.doc("book/main").onSnapshot(snap => { S.settings = snap.exists ? { ...snap.data() } : {}; S.ready.settings = true; if (!$('form[data-form="settings"]') || !document.activeElement?.closest?.("form")) render(); else renderNav(); }, onErr);
  for (const c of ["customers", "quotes", "invoices", "entries", "fixedAssets"]) {
    db.collection(c).onSnapshot(q => { S[c] = q.docs.map(d => ({ id: d.id, ...d.data() })); S.ready[c] = true; render(); }, onErr);
  }
}
boot();
</script>
