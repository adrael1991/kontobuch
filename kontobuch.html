<title>Kontobuch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Hanken+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: modern ledger book — a narrow tab rail on the left, one elevated working sheet on the right; amounts set in mono like a Kontobuch column, income in green ink, expenses in red ink, final sums double-ruled. */
:root {
  --paper: #f4f6f3;
  --sheet: #ffffff;
  --ink: #182420;
  --muted: #5a6963;
  --rule: #dae2dc;
  --rule-strong: #b8c4bc;
  --accent: #1e6a50;
  --accent-soft: #e3eee8;
  --accent-ring: rgba(30, 106, 80, 0.22);
  --on-accent: #ffffff;
  --haben: #1b664d;
  --haben-soft: #e2f1ea;
  --soll: #af3628;
  --soll-soft: #f8e7e4;
  --warn: #8e5c00;
  --warn-soft: #faeed0;
  --info: #255c8a;
  --info-soft: #e2eef7;
  --shadow-xs: 0 1px 2px rgb(24 36 32 / .04);
  --shadow-sm: 0 1px 3px rgb(24 36 32 / .06), 0 1px 2px rgb(24 36 32 / .04);
  --shadow-md: 0 4px 14px rgb(24 36 32 / .08), 0 2px 6px rgb(24 36 32 / .04);
  --shadow-lg: 0 12px 32px rgb(24 36 32 / .10), 0 4px 12px rgb(24 36 32 / .05);
  --shadow-modal: 0 24px 64px rgb(0 0 0 / .28), 0 8px 24px rgb(0 0 0 / .12);
  --shadow: var(--shadow-sm);
  --f-display: "Bricolage Grotesque", "Hanken Grotesk", system-ui, sans-serif;
  --f-body: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r-sm: 5px;
  --r: 8px;
  --r-md: 10px;
  --r-lg: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f1513; --sheet: #17201d; --ink: #e5ece8; --muted: #95a59f;
    --rule: #25332c; --rule-strong: #384a41; --accent: #4ebf92; --accent-soft: #193226;
    --accent-ring: rgba(78, 191, 146, 0.28);
    --on-accent: #091711; --haben: #5fc99b; --haben-soft: #183126; --soll: #f0897d; --soll-soft: #381f1d;
    --warn: #eab754; --warn-soft: #372a11; --info: #8ec3f2; --info-soft: #182c3f;
    --shadow-xs: 0 1px 2px rgb(0 0 0 / .35);
    --shadow-sm: 0 1px 3px rgb(0 0 0 / .4), 0 1px 2px rgb(0 0 0 / .25);
    --shadow-md: 0 6px 18px rgb(0 0 0 / .45), 0 2px 6px rgb(0 0 0 / .3);
    --shadow-lg: 0 16px 36px rgb(0 0 0 / .55);
    --shadow-modal: 0 24px 64px rgb(0 0 0 / .65), 0 8px 20px rgb(0 0 0 / .35);
    --shadow: var(--shadow-sm);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f1513; --sheet: #17201d; --ink: #e5ece8; --muted: #95a59f;
  --rule: #25332c; --rule-strong: #384a41; --accent: #4ebf92; --accent-soft: #193226;
  --accent-ring: rgba(78, 191, 146, 0.28);
  --on-accent: #091711; --haben: #5fc99b; --haben-soft: #183126; --soll: #f0897d; --soll-soft: #381f1d;
  --warn: #eab754; --warn-soft: #372a11; --info: #8ec3f2; --info-soft: #182c3f;
  --shadow-xs: 0 1px 2px rgb(0 0 0 / .35);
  --shadow-sm: 0 1px 3px rgb(0 0 0 / .4), 0 1px 2px rgb(0 0 0 / .25);
  --shadow-md: 0 6px 18px rgb(0 0 0 / .45), 0 2px 6px rgb(0 0 0 / .3);
  --shadow-lg: 0 16px 36px rgb(0 0 0 / .55);
  --shadow-modal: 0 24px 64px rgb(0 0 0 / .65), 0 8px 20px rgb(0 0 0 / .35);
  --shadow: var(--shadow-sm);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--paper); color: var(--ink); font: 15px/1.5 var(--f-body); text-rendering: optimizeLegibility; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: 1.9rem; font-weight: 700; letter-spacing: -.02em; }
h2 { font-size: 1.25rem; font-weight: 700; letter-spacing: -.01em; }
h3 { font-size: .78rem; font-weight: 600; font-family: var(--f-body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
p { margin: 0; }
a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 2px; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono, .amt { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.amt { white-space: nowrap; text-align: right; }
.in { color: var(--haben); } .out { color: var(--soll); }
.muted { color: var(--muted); }
.small { font-size: .85rem; }

.app { display: grid; grid-template-columns: 228px minmax(0, 1fr); min-height: 100vh; }
.rail { border-right: 1px solid var(--rule); padding: 24px 14px; display: flex; flex-direction: column; gap: 24px; position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; background: var(--paper); }
.brand { padding: 0 8px; display: flex; align-items: center; gap: 12px; }
.brand-badge { width: 36px; height: 36px; border-radius: var(--r-md); background: linear-gradient(135deg, var(--accent) 0%, #114c38 100%); color: #ffffff; display: flex; align-items: center; justify-content: center; font-family: var(--f-display); font-weight: 700; font-size: .95rem; letter-spacing: .02em; box-shadow: 0 2px 6px rgb(30 106 80 / .28); flex-shrink: 0; }
.brand-text { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.brand-text b { font-family: var(--f-display); font-size: 1.25rem; letter-spacing: -.02em; line-height: 1.15; }
.brand-text span { font-size: .78rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav { display: flex; flex-direction: column; gap: 3px; }
.nav button { all: unset; cursor: pointer; padding: 8px 12px; border-radius: var(--r); display: flex; justify-content: space-between; align-items: center; gap: 10px; color: var(--muted); font-weight: 500; font-size: .92rem; transition: all .14s ease; }
.nav-item-main { display: inline-flex; align-items: center; gap: 10px; min-width: 0; }
.nav-icon { width: 17px; height: 17px; flex-shrink: 0; opacity: .75; transition: opacity .14s ease; }
.nav button:hover { color: var(--ink); background: var(--accent-soft); }
.nav button:hover .nav-icon { opacity: 1; }
.nav button[aria-current="page"] { color: var(--ink); background: var(--sheet); font-weight: 600; box-shadow: inset 3px 0 0 var(--accent), var(--shadow-sm); }
.nav button[aria-current="page"] .nav-icon { color: var(--accent); opacity: 1; }
.nav button:focus-visible { outline: 2px solid var(--accent); }
.nav .count { font-family: var(--f-mono); font-size: .75rem; background: var(--warn-soft); color: var(--warn); padding: 1px 7px; border-radius: 99px; font-weight: 600; }
.rail-foot { margin-top: auto; padding: 0 8px; font-size: .78rem; color: var(--muted); display: flex; flex-direction: column; gap: 8px; }
.theme-btn { align-self: flex-start; padding: 4px 10px; font-size: .8rem; gap: 6px; border-radius: var(--r); border: 1px solid var(--rule); }
.theme-btn:hover { background: var(--accent-soft); color: var(--ink); border-color: var(--rule-strong); }
.btn-icon { width: 14px; height: 14px; flex-shrink: 0; }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); margin-right: 6px; vertical-align: 1px; }
.dot.ok { background: var(--haben); } .dot.err { background: var(--soll); }

main { padding-inline: clamp(16px, 4vw, 48px); padding-block: 32px 64px; min-width: 0; display: flex; flex-direction: column; gap: 28px; max-width: 1200px; }
.head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; }
.head-l { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.btn { cursor: pointer; border: 1px solid var(--rule-strong); background: var(--sheet); color: var(--ink); padding: 8px 16px; border-radius: var(--r); font-weight: 500; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; box-shadow: var(--shadow-xs); transition: background .15s ease, border-color .15s ease, color .15s ease, box-shadow .15s ease, transform .1s ease; user-select: none; }
.btn:hover { border-color: var(--ink); box-shadow: var(--shadow-sm); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); box-shadow: 0 1px 3px rgb(30 106 80 / 0.25), var(--shadow-xs); }
.btn.primary:hover { filter: brightness(1.08); box-shadow: 0 3px 8px rgb(30 106 80 / 0.32); }
.btn.danger { color: var(--soll); border-color: var(--rule-strong); }
.btn.danger:hover { background: var(--soll-soft); border-color: var(--soll); }
.btn.sm { padding: 4px 11px; font-size: .84rem; border-radius: var(--r-sm); }
.btn.ghost { border-color: transparent; background: transparent; box-shadow: none; }
.btn.ghost:hover { border-color: var(--rule-strong); background: var(--accent-soft); }
.btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
.icon-btn { all: unset; cursor: pointer; width: 32px; height: 32px; display: grid; place-items: center; border-radius: var(--r); font-size: 1.25rem; line-height: 1; color: var(--muted); transition: background .15s ease, color .15s ease; }
.icon-btn:hover { background: var(--accent-soft); color: var(--ink); }
.icon-btn:focus-visible { outline: 2px solid var(--accent); }

select.year { border: 1px solid var(--rule-strong); background: var(--sheet); border-radius: var(--r); padding: 6px 12px; font-family: var(--f-mono); transition: border-color .15s ease, box-shadow .15s ease; }
select.year:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring); }

.sheet-card { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r-md); box-shadow: var(--shadow-sm); transition: box-shadow .15s ease, border-color .15s ease; }
.section { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }

.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.kpi { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r-md); padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; box-shadow: var(--shadow-sm); transition: transform .18s cubic-bezier(0.16, 1, 0.3, 1), box-shadow .18s cubic-bezier(0.16, 1, 0.3, 1), border-color .18s ease; position: relative; }
.kpi:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: var(--rule-strong); }
.kpi .v { font-family: var(--f-mono); font-size: 1.45rem; font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.kpi .s { font-size: .82rem; color: var(--muted); }

.grid2 { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 28px; align-items: start; }

.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; padding: 11px 14px; border-bottom: 1px solid var(--rule-strong); white-space: nowrap; }
td { padding: 11px 14px; border-bottom: 1px solid var(--rule); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
th.r, td.r { text-align: right; }
td.actions { text-align: right; white-space: nowrap; }
td.actions .btn + .btn { margin-left: 5px; }
tbody tr.clickable { cursor: pointer; transition: background .12s ease; }
tbody tr.clickable:hover td { background: var(--accent-soft); }
tr.total td { border-top: 1px solid var(--ink); font-weight: 600; }
tr.grand td { border-bottom: 3px double var(--ink); font-weight: 600; }
.sub { display: block; font-size: .82rem; color: var(--muted); }
.strike { text-decoration: line-through; color: var(--muted); }

.chip { display: inline-flex; align-items: center; gap: 5px; font-size: .75rem; font-weight: 600; padding: 3px 10px; border-radius: 99px; white-space: nowrap; letter-spacing: .01em; }
.chip.draft { background: var(--rule); color: var(--muted); }
.chip.open { background: var(--info-soft); color: var(--info); }
.chip.overdue { background: var(--warn-soft); color: var(--warn); }
.chip.paid { background: var(--accent-soft); color: var(--haben); }
.chip.accepted { background: var(--accent-soft); color: var(--haben); }
.chip.billed { background: var(--info-soft); color: var(--ink); }
.chip.rejected { background: var(--soll-soft); color: var(--soll); }
.chip.expired { background: var(--warn-soft); color: var(--warn); }
.chip.cancelled { background: var(--soll-soft); color: var(--soll); }
.chip.in { background: var(--accent-soft); color: var(--haben); }
.chip.out { background: var(--soll-soft); color: var(--soll); }

.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.filters button { cursor: pointer; border: 1px solid var(--rule); background: var(--sheet); padding: 5px 14px; border-radius: 99px; font-size: .84rem; font-weight: 500; color: var(--muted); transition: all .14s ease; }
.filters button:hover { border-color: var(--rule-strong); color: var(--ink); }
.filters button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); box-shadow: var(--shadow-xs); }
input.search { border: 1px solid var(--rule-strong); background: var(--sheet); border-radius: var(--r); padding: 7px 12px; min-width: 0; width: 220px; max-width: 100%; transition: border-color .15s ease, box-shadow .15s ease; }
input.search:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring); }

.meter { display: flex; flex-direction: column; gap: 6px; }
.meter .bar { height: 8px; background: var(--rule); border-radius: 99px; overflow: hidden; }
.meter .bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.meter .bar i.warn { background: var(--warn); } .meter .bar i.crit { background: var(--soll); }
.meter .row { display: flex; justify-content: space-between; gap: 8px; font-size: .85rem; }
.panel { padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.note { font-size: .85rem; color: var(--muted); border-left: 3px solid var(--rule-strong); padding-left: 12px; }
.note.warn { border-color: var(--warn); color: var(--ink); }

.empty { padding: 40px 24px; display: flex; flex-direction: column; align-items: flex-start; gap: 12px; }
.empty p { max-width: 52ch; color: var(--muted); }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0; }
.steps li { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--rule); }
.steps li:last-child { border-bottom: 0; }
.steps .tick { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--rule-strong); display: grid; place-items: center; font-size: .75rem; flex: none; font-family: var(--f-mono); color: var(--muted); }
.steps .done .tick { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.steps .done span.t { color: var(--muted); text-decoration: line-through; }
.steps .t { flex: 1; min-width: 0; }

.banner { padding: 14px 18px; border-radius: var(--r); background: var(--warn-soft); color: var(--ink); font-size: .9rem; border: 1px solid var(--warn); }

/* forms */
.form { display: flex; flex-direction: column; gap: 18px; }
.fields { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 14px 16px; }
.f { display: flex; flex-direction: column; gap: 5px; min-width: 0; grid-column: span 3; }
.f.full { grid-column: 1 / -1; } .f.s2 { grid-column: span 2; } .f.s4 { grid-column: span 4; } .f.s1 { grid-column: span 1; }
.f label, .lbl { font-size: .8rem; font-weight: 600; color: var(--muted); }
.f input, .f select, .f textarea, .item-row input, .item-row select { border: 1px solid var(--rule-strong); background: var(--sheet); border-radius: var(--r); padding: 8px 12px; width: 100%; min-width: 0; color: var(--ink); transition: border-color .15s ease, box-shadow .15s ease; }
.f input:focus, .f select:focus, .f textarea:focus, .item-row input:focus, .item-row select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring); }
.f textarea { resize: vertical; min-height: 80px; }
.f .hint { font-size: .78rem; color: var(--muted); }
.check { display: flex; gap: 10px; align-items: flex-start; }
.check input { margin-top: 4px; accent-color: var(--accent); }
fieldset { border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 14px; }
legend { font-family: var(--f-display); font-weight: 700; font-size: 1.08rem; margin-bottom: 8px; padding: 0; letter-spacing: -.01em; }
.form-foot { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding-top: 6px; }
.form-foot .grp { display: flex; gap: 8px; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--rule-strong); border-radius: var(--r); overflow: hidden; }
.seg label { padding: 7px 16px; cursor: pointer; font-weight: 500; font-size: .9rem; transition: background .12s ease, color .12s ease; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg input:checked + span { color: var(--on-accent); }
.seg label:has(input:checked) { background: var(--accent); color: var(--on-accent); }
.seg label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: -2px; }

.items { display: flex; flex-direction: column; gap: 8px; }
.item-row { display: grid; grid-template-columns: minmax(0, 1fr) 72px 72px 104px 76px 100px 84px; gap: 8px; align-items: center; }
.item-row.ku { grid-template-columns: minmax(0, 1fr) 72px 72px 104px 100px 84px; }
.item-row output { font-family: var(--f-mono); text-align: right; font-variant-numeric: tabular-nums; }
.item-acts { display: inline-flex; align-items: center; justify-content: flex-end; gap: 2px; }
.item-acts .icon-btn { width: 26px; height: 28px; font-size: .95rem; }
.item-acts .icon-btn:disabled { opacity: .25; cursor: default; pointer-events: none; }
.item-head { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.item-head span:nth-child(n+2) { text-align: right; }
.totals { margin-left: auto; width: min(320px, 100%); display: flex; flex-direction: column; gap: 4px; }
.totals div { display: flex; justify-content: space-between; gap: 12px; }
.totals .g { border-top: 1px solid var(--ink); border-bottom: 3px double var(--ink); padding-block: 4px; font-weight: 600; }

/* modal */
#modal { position: fixed; inset: 0; background: rgb(15 23 20 / 0.52); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); display: flex; align-items: flex-start; justify-content: center; padding: max(28px, env(safe-area-inset-top, 0px)) 16px 28px; overflow-y: auto; z-index: 20; }
.dialog { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r-lg); width: min(640px, 100%); box-shadow: var(--shadow-modal); display: flex; flex-direction: column; overflow: hidden; }
.dialog.wide { width: min(1040px, 100%); }
.dialog.extra-wide { width: min(1420px, 96vw); }
.dialog > header { display: flex; justify-content: space-between; align-items: center; padding: 18px 24px; border-bottom: 1px solid var(--rule); background: var(--sheet); gap: 12px; }
.dialog-body { padding: 24px; display: flex; flex-direction: column; gap: 18px; }

/* receipt preview & split dialog */
.split-layout { display: grid; grid-template-columns: minmax(360px, 480px) minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 900px) {
  .split-layout { grid-template-columns: minmax(0, 1fr); }
}
.preview-pane { display: flex; flex-direction: column; gap: 8px; background: var(--paper); border: 1px solid var(--rule); border-radius: var(--r-md); padding: 14px; position: sticky; top: 12px; }
.preview-bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: .82rem; }
.preview-bar .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 260px; }
.preview-content { border-radius: var(--r); overflow: hidden; background: #fff; border: 1px solid var(--rule); display: flex; align-items: center; justify-content: center; min-height: 300px; box-shadow: var(--shadow-xs); }
.preview-frame { width: 100%; height: clamp(540px, 75vh, 880px); border: 0; background: #fff; }
.preview-img { width: 100%; max-height: clamp(540px, 75vh, 880px); object-fit: contain; }
.preview-modal-frame { width: 100%; height: 78vh; border: 0; background: #fff; }
.preview-modal-img { max-width: 100%; max-height: 78vh; object-fit: contain; display: block; margin: 0 auto; border-radius: var(--r); }

/* invoice preview, DIN 5008 flavour */
.paper { background: #fff; color: #1a1a1a; border: 1px solid var(--rule); border-radius: var(--r-md); box-shadow: var(--shadow-md); padding: 40px 44px; font-size: 13px; line-height: 1.45; display: flex; flex-direction: column; gap: 22px; color-scheme: light; }
.paper .ph { display: flex; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
.paper .ph b { font-family: var(--f-display); font-size: 20px; }
.paper .addr { white-space: pre-line; }
.paper .sender { font-size: 10px; color: #666; border-bottom: 1px solid #bbb; display: inline-block; margin-bottom: 4px; }

.paper .meta span:nth-child(odd) { color: #666; }

<script>
"use strict";
/* ---------- constants ---------- */
/* Kategorien mit dem Feld (Kennzahl) der Anlage EÜR, in das sie gehören. Die IDs bleiben stabil, sie stehen in alten Buchungen. */
const OUT_CATS = [

  ["fremd", "Fremdleistungen", "110"],
  ["afa", "Abschreibungen (AfA) beweglicher Anschaffungen", "130"],
  ["gwg", "Geringwertige Wirtschaftsgüter (bis 800 € netto)", "132"],
  ["raum", "Miete für Geschäftsräume", "150"],

  ["fortbildung", "Fortbildung (Kurse, Seminare)", "281"],
  ["beratung", "Steuerberatung & Buchführung", "194"],
  ["versicherung", "Beiträge, Gebühren & Versicherungen", "223"],
  ["software", "Software, Hosting & EDV", "228"],

const IN_CATS = [
  ["umsatz", "Umsatz ohne Rechnung"],
  ["sonstige_in", "Sonstige Betriebseinnahmen"],
];
const CAT = Object.fromEntries([...OUT_CATS, ...IN_CATS]);
const OUT_KZ = Object.fromEntries(OUT_CATS.map(([k, , kz]) => [k, kz]));
/* Felder der Anlage EÜR in Formular-Reihenfolge (Kennzahlen wie im Formular 2024/2025). */
const INC_LINES = [["111", "Betriebseinnahmen als umsatzsteuerlicher Kleinunternehmer"], ["112", "Umsatzsteuerpflichtige Betriebseinnahmen"], ["140", "Vereinnahmte Umsatzsteuer"]];
const OUT_LINES = [["100", "Waren, Rohstoffe und Hilfsstoffe"], ["110", "Bezogene Fremdleistungen"], ["130", "AfA auf bewegliche Wirtschaftsgüter"],
  ["132", "Aufwendungen für geringwertige Wirtschaftsgüter"], ["150", "Miete/Pacht für Geschäftsräume"], ["280", "Aufwendungen für Telekommunikation"],
  ["221", "Übernachtungs- und Reisenebenkosten"], ["281", "Fortbildungskosten"], ["194", "Kosten für Rechts- und Steuerberatung, Buchführung"],
  ["223", "Beiträge, Gebühren, Abgaben und Versicherungen"], ["228", "Laufende EDV-Kosten"], ["229", "Arbeitsmittel"], ["224", "Werbekosten"],
  ["185", "Gezahlte Vorsteuerbeträge"], ["183", "Übrige unbeschränkt abziehbare Betriebsausgaben"], ["175", "Bewirtungsaufwendungen (abziehbar)"],
  ["146", "Sonstige tatsächliche Fahrtkosten"]];
const KU_PREV = 25000, KU_CUR = 100000;
const VIEWS = [
  ["overview", "Übersicht"],
  ["quotes", "Angebote"],
  ["invoices", "Rechnungen"],
  ["entries", "Einnahmen & Ausgaben"],
  ["customers", "Kunden"],
  ["anlagen", "Anlagen"],
  ["euer", "EÜR"],
  ["settings", "Einstellungen"],
];
const SELLER_FIELDS = ["name", "owner", "street", "zip", "city", "email", "phone", "web", "taxNo", "vatId", "bank", "iban", "bic"];

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fEur = new Intl.NumberFormat("de-DE", { style: "currency", currency: "EUR" });
const fNum = new Intl.NumberFormat("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const eur = n => fEur.format(n || 0);
const num = n => fNum.format(n || 0);
const r2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
const parseNum = v => {
  let s = String(v ?? "").trim().replace(/\s|€/g, "");
  if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
};
const numIn = n => (n === "" || n == null) ? "" : String(n).replace(".", ",");
const pad = n => String(n).padStart(2, "0");
const isoDate = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => isoDate(new Date());
const addDays = (iso, days) => { const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + Number(days || 0)); return isoDate(d); };
const fDate = iso => iso ? iso.split("-").reverse().join(".") : "–";
const yOf = iso => iso ? Number(iso.slice(0, 4)) : null;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };

/* ---------- state ---------- */
const S = { settings: {}, customers: [], quotes: [], invoices: [], entries: [], fixedAssets: [], ready: {}, conn: "pending" };
let db = null, assets = null, downloads = null;
let view = VIEWS.some(v => v[0] === location.hash.slice(1)) ? location.hash.slice(1) : (lsGet("kb.view") || "overview");
let year = new Date().getFullYear();
let period = "all";
const F = { inv: "all", quo: "all", ent: "all", q: "" };
let ed = null; // invoice editor state
let edQuote = null; // quote editor state

const DEF = { kleinunternehmer: true, invoicePrefix: "RE-{JAHR}-", nextInvoiceNo: 1, numberPad: 3, paymentDays: 14,
  quotePrefix: "ANG-{JAHR}-", nextQuoteNo: 1, quoteValidityDays: 30,
  quoteIntro: "Vielen Dank für Ihre Anfrage. Gerne unterbreiten wir Ihnen folgendes Angebot:",
  quoteClosing: "Wir freuen uns auf Ihren Auftrag und stehen für Rückfragen gerne zur Verfügung.",
  intro: "Vielen Dank für Ihren Auftrag. Ich berechne Ihnen folgende Leistungen:",
  closing: "Mit freundlichen Grüßen",
  hideTextHeader: false, hideTextFooter: false,
  logoData: "", logoName: "", logoFileId: null,
  stationeryData: "", stationeryName: "", stationeryFileId: null };
const sett = () => ({ ...DEF, ...S.settings });
const allReady = () => ["settings", "customers", "quotes", "invoices", "entries", "fixedAssets"].every(k => S.ready[k]);

/* ---------- money logic ---------- */
function calcInv(inv) {
  let net = 0; const byRate = {};
  for (const it of inv.items || []) {
    const line = r2(parseNum(it.qty) * parseNum(it.price));
    net += line;
    const rate = inv.ku ? 0 : Number(it.vat || 0);
    byRate[rate] = (byRate[rate] || 0) + line;
  }
  let vat = 0;
  for (const [rate, base] of Object.entries(byRate)) vat += r2(base * Number(rate) / 100);
  net = r2(net); vat = r2(vat);
  return { net, vat, gross: r2(net + vat), byRate };
}
function entryParts(e) {
  const rate = Number(e.vatRate || 0), gross = Number(e.gross || 0);
  const net = rate ? r2(gross / (1 + rate / 100)) : gross;
  return { gross, net, vat: r2(gross - net) };
}
const invState = inv => {
  if (inv.status === "open" && inv.dueDate && inv.dueDate < today()) return "overdue";
  return inv.status || "draft";
};
const quoteState = q => {
  if (q.status === "open" && q.validUntil && q.validUntil < today()) return "expired";
  return q.status || "draft";
};
const STATUS_LABEL = {
  draft: "Entwurf",
  open: "Offen",
  overdue: "Überfällig",
  paid: "Bezahlt",
  cancelled: "Storniert",
  accepted: "Angenommen",
  billed: "Abgerechnet",
  rejected: "Abgelehnt",
  expired: "Abgelaufen"
};
const chip = st => `<span class="chip ${st}">${STATUS_LABEL[st] || st}</span>`;
const custName = id => S.customers.find(c => c.id === id)?.name;
const invTitle = inv => inv.recipient ? inv.recipient.split("\n")[0] : (custName(inv.customerId) || "Ohne Empfänger");

const PERIOD_OPTS = [
  ["all", "Ganzes Jahr"],
  ["q1", "1. Quartal (Q1: Jan–Mär)"],
  ["q2", "2. Quartal (Q2: Apr–Jun)"],
  ["q3", "3. Quartal (Q3: Jul–Sep)"],
  ["q4", "4. Quartal (Q4: Okt–Dez)"],
  ["01", "Januar"],
  ["02", "Februar"],
  ["03", "März"],
  ["04", "April"],
  ["05", "Mai"],
  ["06", "Juni"],
  ["07", "Juli"],
  ["08", "August"],
  ["09", "September"],
  ["10", "Oktober"],
  ["11", "November"],
  ["12", "Dezember"]
];
const periodSel = () => `<label class="muted small" for="period-sel">Zeitraum</label>
  <select class="period" id="period-sel" data-change="period">${PERIOD_OPTS.map(([k, l]) => `<option value="${k}" ${k === period ? "selected" : ""}>${l}</option>`).join("")}</select>`;
const periodLabel = (p, y) => {
  const opt = PERIOD_OPTS.find(x => x[0] === p);
  return opt && p !== "all" ? `${opt[1]} ${y}` : `${y}`;
};

function matchPeriod(dateStr, p) {
  if (!p || p === "all") return true;
  const m = String(dateStr || "").slice(5, 7);
  if (p === "q1") return ["01", "02", "03"].includes(m);
  if (p === "q2") return ["04", "05", "06"].includes(m);
  if (p === "q3") return ["07", "08", "09"].includes(m);
  if (p === "q4") return ["10", "11", "12"].includes(m);
  return m === p;
}

/* Zufluss-Prinzip: Rechnungen zählen im Jahr der Zahlung. */
function journal(y, p = "all") {
  const rows = [];
  for (const inv of S.invoices) {
    if (inv.status !== "paid" || yOf(inv.paidDate) !== y || !matchPeriod(inv.paidDate, p)) continue;
    const t = calcInv(inv);
    rows.push({ src: "inv", id: inv.id, kind: "in", date: inv.paidDate, party: invTitle(inv), desc: `Rechnung ${inv.number}`, ref: inv.number,
      category: "rechnung", gross: t.gross, net: t.net, vat: t.vat, ku: !!inv.ku, byRate: t.byRate });
  }
  for (const e of S.entries) {
    if (yOf(e.date) !== y || !matchPeriod(e.date, p)) continue;
    const parts = entryParts(e);
    rows.push({ src: "entry", id: e.id, kind: e.kind, date: e.date, party: e.party, desc: e.desc, ref: e.ref || "", category: e.category,
      gross: parts.gross, net: parts.net, vat: parts.vat, ku: !!e.ku, receiptId: e.receiptId, receiptName: e.receiptName, vatRate: e.vatRate });
  }
  return rows.sort((a, b) => b.date.localeCompare(a.date));
}
/* Abschreibungs-Berechnung nach § 7 Abs. 1 EStG (monatsgenau) bzw. GWG (§ 6 Abs. 2) */
function calcAsset(a, targetYear) {
  const acqY = yOf(a.date);
  const acqM = a.date ? (Number(a.date.slice(5, 7)) || 1) : 1;
  const cost = Number(a.cost || 0);
  const nd = Math.max(1, Number(a.nd || 1));
  const isGwg = a.method === "gwg" || nd === 1;

  if (!acqY || targetYear < acqY) {
    return { bookStart: 0, additions: 0, afa: 0, bookEnd: 0, isFuture: true, isDone: false };
  }

  if (isGwg) {
    if (targetYear === acqY) {
      return { bookStart: 0, additions: cost, afa: cost, bookEnd: 0, isFuture: false, isDone: true };
    }
    return { bookStart: 0, additions: 0, afa: 0, bookEnd: 0, isFuture: false, isDone: true };
  }

  const mFirst = 13 - acqM;
  const yearlyNorm = r2(cost / nd);
  const firstYearAfa = r2(yearlyNorm * (mFirst / 12));

  let curBook = cost;
  for (let y = acqY; y <= targetYear; y++) {
    const bookStart = (y === acqY) ? 0 : curBook;
    const additions = (y === acqY) ? cost : 0;
    const basis = (y === acqY) ? cost : curBook;

    let afa = 0;
    if (basis > 0) {
      if (y === acqY) {
        afa = Math.min(basis, firstYearAfa);
      } else {
        afa = Math.min(basis, yearlyNorm);
      }
    }
    const bookEnd = r2(basis - afa);
    curBook = bookEnd;

    if (y === targetYear) {
      return {
        bookStart,
        additions,
        afa,
        bookEnd,
        isFuture: false,
        isDone: bookEnd === 0 && (bookStart === 0 || additions === 0)
      };
    }
  }
  return { bookStart: 0, additions: 0, afa: 0, bookEnd: 0, isFuture: false, isDone: true };
}
function euer(y, p = "all") {
  const rows = journal(y, p);
  const sums = {}; let nonDeductible = 0;
  let ust19Base = 0, ust7Base = 0;
  const add = (kz, v) => { if (v) sums[kz] = r2((sums[kz] || 0) + v); };
  for (const r of rows) {
    if (r.kind === "in") {
      if (r.vat === 0 && r.ku) add("111", r.gross);
      else {
        add("112", r.net);
        add("140", r.vat);
        if (r.byRate) {
          ust19Base = r2(ust19Base + (r.byRate["19"] || 0));
          ust7Base = r2(ust7Base + (r.byRate["7"] || 0));
        } else {
          if (Number(r.vatRate) === 19) ust19Base = r2(ust19Base + r.net);
          else if (Number(r.vatRate) === 7) ust7Base = r2(ust7Base + r.net);
        }
      }
    } else {
      let amt = r.net;
      add("185", r.vat);
      if (r.category === "bewirtung") { nonDeductible = r2(nonDeductible + r2(amt * 0.3)); amt = r2(amt * 0.7); }
      add(OUT_KZ[r.category] || "183", amt);
    }
  }
  const assetCalcs = (S.fixedAssets || []).map(a => calcAsset(a, y));
  const fullYearAfa = r2(assetCalcs.reduce((acc, c) => acc + (c?.afa || 0), 0));
  let afaFromAssets = fullYearAfa;
  if (p === "q1" || p === "q2" || p === "q3" || p === "q4") afaFromAssets = r2(fullYearAfa * 0.25);
  else if (/^\d{2}$/.test(p)) afaFromAssets = r2(fullYearAfa / 12);
  if (afaFromAssets) add("130", afaFromAssets);

  const lines = list => list.filter(([kz]) => sums[kz]).map(([kz, label]) => ({ kz, label, amount: sums[kz] }));
  const inc = lines(INC_LINES), out = lines(OUT_LINES);
  const incTotal = r2(inc.reduce((a, l) => a + l.amount, 0)), outTotal = r2(out.reduce((a, l) => a + l.amount, 0));
  const ust = sums["140"] || 0, vorsteuer = sums["185"] || 0;
  return { rows, inc, out, ust, vorsteuer, ust19Base, ust7Base, ustZahllast: r2(ust - vorsteuer), nonDeductible, incTotal, outTotal, profit: r2(incTotal - outTotal), afaFromAssets, period: p };
}
/* Gesamtumsatz nach § 19 UStG: vereinnahmte Entgelte. */
function kuTurnover(y) {
  return r2(journal(y).filter(r => r.kind === "in" && r.category !== "sonstige_in").reduce((a, r) => a + r.net, 0));
}
function years() {
  const ys = new Set([new Date().getFullYear(), year]);
  S.invoices.forEach(i => { if (i.date) ys.add(yOf(i.date)); if (i.paidDate) ys.add(yOf(i.paidDate)); });
  (S.quotes || []).forEach(q => q.date && ys.add(yOf(q.date)));
  S.entries.forEach(e => e.date && ys.add(yOf(e.date)));
  (S.fixedAssets || []).forEach(a => a.date && ys.add(yOf(a.date)));
  return [...ys].sort((a, b) => b - a);
}

/* ---------- db writes ---------- */
async function guard(fn, okMsg) {
  if (!db) { toast("Der Datenspeicher ist in dieser Ansicht nicht verfügbar.", true); return false; }
  try { const r = await fn(); if (okMsg) toast(okMsg); return r ?? true; }
  catch (e) {
    console.error(e);
    const code = e?.code;
    const msg = code === "quota_exceeded" ? "Speicher voll. Lösche alte Einträge oder exportiere ein Backup."
      : code === "invalid_argument" ? "Speichern abgelehnt. Nur die Besitzerin oder der Besitzer dieses Kontobuchs kann Daten ändern."
      : "Speichern fehlgeschlagen. Bitte versuche es gleich noch einmal.";
    toast(msg, true); return false;
  }
}
const saveSettings = patch => guard(() => db.doc("book/main").set({ ...sett(), ...patch, updatedAt: new Date().toISOString() }));
const saveDoc = (coll, id, data) => guard(() => db.collection(coll).doc(id).set({ ...data, updatedAt: new Date().toISOString() }));
const delDoc = (coll, id) => guard(() => db.collection(coll).doc(id).delete());

/* ---------- toast ---------- */
let toastT;
function toast(msg, err) {
  const t = $("#toast"); t.textContent = msg; t.className = err ? "err" : ""; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, err ? 6000 : 2600);
}

/* ---------- modal ---------- */
let lastFocus = null, modalDirty = false;
function openModal(title, body, { wide, extraWide } = {}) {
  lastFocus = document.activeElement;
  modalDirty = false;
  const m = $("#modal");
  const cls = extraWide ? "extra-wide" : (wide ? "wide" : "");
  m.innerHTML = `<div class="dialog ${cls}" role="dialog" aria-modal="true" aria-labelledby="m-title">
    <header><h2 id="m-title">${esc(title)}</h2><button class="icon-btn" data-act="close" aria-label="Schließen">×</button></header>
    <div class="dialog-body">${body}</div></div>`;
  m.hidden = false;
  ($("[autofocus]", m) || $("input,select,textarea", m) || $("button", m))?.focus();
}
function closeModal(force = true) {
  if (!force && modalDirty) {
    if (!window.confirm("Du hast ungespeicherte Eingaben. Möchtest du das Fenster wirklich schließen und die Änderungen verwerfen?")) return false;
  }
  modalDirty = false;
  const m = $("#modal"); m.hidden = true; m.innerHTML = ""; ed = null; edQuote = null; lastFocus?.focus?.();
  return true;
}
function confirmBox(title, text, yesLabel, onYes, danger = true) {
  openModal(title, `<p>${text}</p><div class="form-foot"><span></span><div class="grp">
    <button class="btn" data-act="close">Abbrechen</button>
    <button class="btn ${danger ? "danger" : "primary"}" id="confirm-yes" autofocus>${esc(yesLabel)}</button></div></div>`);
  $("#confirm-yes").onclick = async () => { $("#confirm-yes").disabled = true; await onYes(); closeModal(); };
}

/* ---------- render shell ---------- */

function renderNav() {
  const overdue = S.invoices.filter(i => invState(i) === "overdue").length;
  const openQuotes = (S.quotes || []).filter(q => quoteState(q) === "open").length;
  $("#nav").innerHTML = VIEWS.map(([k, l]) => `<button data-act="nav" data-v="${k}" ${view === k ? 'aria-current="page"' : ""}>
    <span class="nav-item-main">${NAV_ICONS[k] || ""}<span>${l}</span></span>${k === "invoices" && overdue ? `<span class="count" title="überfällig">${overdue}</span>` : ""}${k === "quotes" && openQuotes ? `<span class="count" title="offene Angebote">${openQuotes}</span>` : ""}</button>`).join("");
  const s = sett();
  $("#brand-sub").textContent = s.name || "Buchhaltung";
  const st = { pending: ["", "Verbinde …"], ok: ["ok", "Daten gespeichert"], none: ["err", "Kein Datenspeicher"], err: ["err", "Verbindung unterbrochen"] }[S.conn];
  const curTheme = document.documentElement.getAttribute("data-theme") || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const themeLabel = curTheme === "dark" ? "Hell-Modus" : "Dunkel-Modus";
  const themeIcon = curTheme === "dark"
    ? `<svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>`
    : `<svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;
  $("#rail-foot").innerHTML = `<span><i class="dot ${st[0]}"></i>${st[1]}</span>${s.kleinunternehmer ? "<span>Kleinunternehmer · § 19 UStG</span>" : "<span>Regelbesteuerung</span>"}<button type="button" class="btn sm ghost theme-btn" data-act="toggle-theme" title="Farbschema wechseln">${themeIcon}<span>${themeLabel}</span></button>`;
}
function render() {
  renderNav();
  const fn = { overview: vOverview, quotes: vQuotes, invoices: vInvoices, entries: vEntries, customers: vCustomers, anlagen: vAnlagen, euer: vEuer, settings: vSettings }[view] || vOverview;
  let banner = "";
  if (S.conn === "none") banner = `<div class="banner">Der Datenspeicher ist hier nicht verfügbar. Öffne das Kontobuch angemeldet auf claude.ai, damit deine Buchungen gespeichert werden.</div>`;
  if (S.conn === "err") banner = `<div class="banner">Die Verbindung zum Datenspeicher wurde unterbrochen. Lade die Seite neu.</div>`;
  $("#main").innerHTML = banner + fn();
}
const yearSel = () => `<label class="muted small" for="year-sel">Jahr</label>
  <select class="year" id="year-sel" data-change="year">${years().map(y => `<option ${y === year ? "selected" : ""}>${y}</option>`).join("")}</select>`;
const loading = () => `<div class="empty"><p>Lade deine Daten …</p></div>`;

/* ---------- views ---------- */
function yearCloseReminder() {
  const s = sett();
  const cy = new Date().getFullYear();
  const prevY = cy - 1;
  const dismissed = s.dismissedReminders || {};
  if (dismissed[prevY]) return "";
  const hasPrevData = S.invoices.some(i => yOf(i.paidDate) === prevY || yOf(i.date) === prevY) ||
                      (S.quotes || []).some(q => yOf(q.date) === prevY) ||
                      S.entries.some(e => yOf(e.date) === prevY) ||
                      (S.fixedAssets || []).some(a => yOf(a.date) <= prevY);
  if (!hasPrevData) return "";

  return `
  <div class="sheet-card panel" style="background:var(--accent-soft);border-color:var(--accent);margin-bottom:12px">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap">
      <div>
        <h2 style="display:flex;align-items:center;gap:8px;font-size:1.1rem;margin:0">
          <span>📦</span> Jahresabschluss & Datensicherung ${prevY}
        </h2>
        <p class="small" style="margin-top:6px;max-width:65ch">
          Das Geschäftsjahr ${prevY} ist abgeschlossen. Lade jetzt deinen GoBD-konformen Jahresabschluss (ZIP-Archiv mit EÜR-Bericht, Journal, Anlagenverzeichnis, allen Rechnungen und Original-Belegen nach § 147 AO) herunter.
        </p>
      </div>
      <div class="toolbar" style="margin-top:4px">
        <button class="btn primary sm" data-act="export-year-zip-explicit" data-year="${prevY}">Jahresabschluss ${prevY} (ZIP)</button>
        <button class="btn ghost sm" data-act="dismiss-reminder" data-year="${prevY}">Erinnerung ausblenden</button>
      </div>
    </div>
  </div>`;
}

function vOverview() {
  const s = sett();
  const e = euer(year);
  const open = S.invoices.filter(i => i.status === "open").sort((a, b) => (a.dueDate || "").localeCompare(b.dueDate || ""));
  const openSum = open.reduce((a, i) => a + calcInv(i).gross, 0);
  const overdue = open.filter(i => invState(i) === "overdue");
  const openQuotes = (S.quotes || []).filter(q => quoteState(q) === "open").sort((a, b) => (a.validUntil || "").localeCompare(b.validUntil || ""));
  const steps = [
    [!!(s.name && s.street && s.taxNo), "Firmendaten und Steuernummer eintragen", "settings", "Einstellungen öffnen"],
    [S.customers.length > 0, "Ersten Kunden anlegen", "new-customer", "Kunde anlegen"],
    [S.invoices.length > 0, "Erste Rechnung schreiben", "new-invoice", "Rechnung schreiben"],
    [S.entries.length > 0, "Erste Ausgabe mit Beleg erfassen", "new-out", "Ausgabe erfassen"],
  ];
  const onboarding = allReady() && steps.some(x => !x[0]) ? `
    <section class="section sheet-card panel">
      <div class="section-head"><h2>Los geht's</h2><span class="muted small">${steps.filter(x => x[0]).length} von 4 erledigt</span></div>
      <ol class="steps">${steps.map(([done, t, act, l], i) => `<li class="${done ? "done" : ""}"><span class="tick">${done ? "✓" : i + 1}</span><span class="t">${t}</span>
        ${done ? "" : act === "settings" ? `<button class="btn sm" data-act="nav" data-v="settings">${l}</button>` : `<button class="btn sm" data-act="${act}">${l}</button>`}</li>`).join("")}</ol>
    </section>` : "";
  const recent = journal(year).slice(0, 6);
  return `
  <div class="head"><div class="head-l"><h3>Geschäftsjahr</h3><h1>Übersicht ${year}</h1></div>
    <div class="toolbar">${yearSel()}<button class="btn" data-act="new-quote">Neues Angebot</button><button class="btn" data-act="new-out">Ausgabe erfassen</button><button class="btn primary" data-act="new-invoice">Neue Rechnung</button></div></div>
  ${allReady() ? yearCloseReminder() : ""}
  ${onboarding}
  <div class="kpis">
    <div class="kpi"><h3>Einnahmen</h3><span class="v in">${eur(e.incTotal)}</span><span class="s">zugeflossen ${year}</span></div>
    <div class="kpi"><h3>Ausgaben</h3><span class="v out">${eur(e.outTotal)}</span><span class="s">abzugsfähig ${year}</span></div>
    <div class="kpi"><h3>Gewinn</h3><span class="v">${eur(e.profit)}</span><span class="s">vorläufig, nach EÜR</span></div>
    <div class="kpi"><h3>Offen</h3><span class="v">${eur(openSum)}</span><span class="s">${open.length} Rechnung${open.length === 1 ? "" : "en"}${overdue.length ? `, <b style="color:var(--warn)">${overdue.length} überfällig</b>` : ""}${openQuotes.length ? ` · ${openQuotes.length} Angebot${openQuotes.length === 1 ? "" : "e"}` : ""}</span></div>
  </div>
  <div class="grid2">
    <section class="section">
      <div class="section-head"><h2>Offene Rechnungen</h2><button class="btn ghost sm" data-act="nav" data-v="invoices">Alle Rechnungen</button></div>
      ${!allReady() ? loading() : open.length ? `<div class="table-wrap sheet-card"><table>
        <thead><tr><th>Nr.</th><th>Kunde</th><th>Fällig</th><th class="r">Betrag</th><th></th></tr></thead><tbody>
        ${open.map(i => `<tr><td class="mono">${esc(i.number)}</td><td>${esc(invTitle(i))}</td><td>${fDate(i.dueDate)} ${invState(i) === "overdue" ? chip("overdue") : ""}</td>
          <td class="amt">${eur(calcInv(i).gross)}</td><td class="actions"><button class="btn sm" data-act="mark-paid" data-id="${i.id}">Bezahlt</button></td></tr>`).join("")}
        </tbody></table></div>` : `<div class="sheet-card empty"><p>Keine offenen Rechnungen. Alles bezahlt.</p></div>`}
      ${openQuotes.length ? `
      <div class="section-head" style="margin-top:12px"><h2>Offene Angebote</h2><button class="btn ghost sm" data-act="nav" data-v="quotes">Alle Angebote</button></div>
      <div class="table-wrap sheet-card"><table>
        <thead><tr><th>Nr.</th><th>Kunde</th><th>Gültig bis</th><th class="r">Betrag</th><th></th></tr></thead><tbody>
        ${openQuotes.map(q => `<tr><td class="mono">${esc(q.number)}</td><td>${esc(quoteTitle(q))}</td><td>${fDate(q.validUntil)} ${quoteState(q) === "expired" ? chip("expired") : ""}</td>
          <td class="amt">${eur(calcInv(q).gross)}</td><td class="actions"><button class="btn sm primary" data-act="quote-to-invoice" data-id="${q.id}">In Rechnung</button></td></tr>`).join("")}
        </tbody></table></div>` : ""}
      <div class="section-head" style="margin-top:12px"><h2>Letzte Buchungen</h2><button class="btn ghost sm" data-act="nav" data-v="entries">Alle Buchungen</button></div>
      ${!allReady() ? loading() : recent.length ? `<div class="table-wrap sheet-card"><table><tbody>
        ${recent.map(r => `<tr><td class="mono small">${fDate(r.date)}</td><td>${esc(r.party || "–")}<span class="sub">${esc(r.desc || CAT[r.category] || "")}</span></td>
          <td class="amt ${r.kind}">${r.kind === "out" ? "−" : "+"}${num(r.gross)}</td></tr>`).join("")}
        </tbody></table></div>` : `<div class="sheet-card empty"><p>Noch keine Buchungen in ${year}. Bezahlte Rechnungen und erfasste Ausgaben erscheinen hier.</p></div>`}
    </section>
    <aside class="section">${kuPanel()}</aside>
  </div>`;
}

function ustaPanel() {
  const cy = new Date().getFullYear();
  const cm = String(new Date().getMonth() + 1).padStart(2, "0");
  const prevMNum = new Date().getMonth() === 0 ? 12 : new Date().getMonth();
  const prevMY = new Date().getMonth() === 0 ? cy - 1 : cy;
  const prevMStr = String(prevMNum).padStart(2, "0");

  const curEuer = euer(cy, cm);
  const prevEuer = euer(prevMY, prevMStr);

  return `
  <div class="sheet-card panel">
    <div class="section-head">
      <div>
        <h2>UStVA & Monatsabschluss</h2>
        <p class="small muted">Monatliche Übersicht für Regelbesteuerer</p>
      </div>
      <button class="btn ghost sm" data-act="nav" data-v="euer">Zur EÜR & UStVA</button>
    </div>
    <div class="meter" style="gap:10px">
      <div style="border-bottom:1px solid var(--rule);padding-bottom:8px">
        <div class="row">
          <span><b>Vormonat (${prevMStr}/${prevMY})</b></span>
          <span class="mono">${prevEuer.ustZahllast >= 0 ? "Zahllast: " + eur(prevEuer.ustZahllast) : "Erstattung: " + eur(Math.abs(prevEuer.ustZahllast))}</span>
        </div>
        <div class="small muted" style="display:flex;justify-content:space-between;margin-top:3px">
          <span>USt 19%: ${eur(r2(prevEuer.ust19Base * 0.19))}</span>
          <span>Vorsteuer: ${eur(prevEuer.vorsteuer)}</span>
        </div>
      </div>
      <div>
        <div class="row">
          <span><b>Laufender Monat (${cm}/${cy})</b></span>
          <span class="mono">${curEuer.ustZahllast >= 0 ? "Zahllast: " + eur(curEuer.ustZahllast) : "Erstattung: " + eur(Math.abs(curEuer.ustZahllast))}</span>
        </div>
        <div class="small muted" style="display:flex;justify-content:space-between;margin-top:3px">
          <span>USt 19%: ${eur(r2(curEuer.ust19Base * 0.19))}</span>
          <span>Vorsteuer: ${eur(curEuer.vorsteuer)}</span>
        </div>
      </div>
    </div>
    <p class="small muted">
      Tipp: Gib deine UStVA jeweils bis zum 10. des Folgemonats bei ELSTER ab. Unter <a href="#euer" data-act="nav" data-v="euer">EÜR</a> kannst du jeden Monat oder jedes Quartal einzeln filtern.
    </p>
  </div>`;
}

function kuPanel() {
  const s = sett();
  if (!s.kleinunternehmer) return ustaPanel();
  const cy = new Date().getFullYear();
  const cur = kuTurnover(cy), prev = kuTurnover(cy - 1);
  const bar = (v, max) => { const p = Math.min(100, v / max * 100); return `<div class="bar"><i class="${p >= 100 ? "crit" : p >= 80 ? "warn" : ""}" style="width:${p.toFixed(1)}%"></i></div>`; };
  let msg = "";
  if (cur > KU_CUR) msg = `<p class="note warn">Du hast ${eur(KU_CUR)} in ${cy} überschritten. Ab dem Umsatz, der die Grenze überschreitet, gilt die Regelbesteuerung. Sprich bitte mit deiner Steuerberatung und stelle in den Einstellungen um.</p>`;
  else if (cur > KU_PREV) msg = `<p class="note warn">Du liegst in ${cy} über ${eur(KU_PREV)}. Damit bist du ab ${cy + 1} kein Kleinunternehmer mehr.</p>`;
  return `<div class="sheet-card panel">
    <div><h2>Kleinunternehmergrenze</h2><p class="small muted">§ 19 UStG: Umsatz im Vorjahr höchstens ${eur(KU_PREV)}, im laufenden Jahr höchstens ${eur(KU_CUR)}.</p></div>
    <div class="meter"><div class="row"><span>${cy} (laufend)</span><span class="mono">${eur(cur)} / ${num(KU_CUR).replace(",00", "")} €</span></div>${bar(cur, KU_CUR)}</div>
    <div class="meter"><div class="row"><span>${cy} für ${cy + 1}</span><span class="mono">${eur(cur)} / ${num(KU_PREV).replace(",00", "")} €</span></div>${bar(cur, KU_PREV)}</div>
    <div class="meter"><div class="row"><span>${cy - 1} (Vorjahr)</span><span class="mono">${eur(prev)} / ${num(KU_PREV).replace(",00", "")} €</span></div>${bar(prev, KU_PREV)}</div>
    ${msg}
    <p class="small muted">Gezählt werden bezahlte Rechnungen und Umsätze ohne Rechnung. Umsätze aus der Zeit vor dem Kontobuch kannst du als Einnahme nachtragen.</p>
  </div>`;
}

function quoteTitle(q) {
  return q.recipient ? q.recipient.split("\n")[0] : (custName(q.customerId) || "Ohne Empfänger");
}

function vQuotes() {
  const list = (S.quotes || []).filter(q => {
    const st = quoteState(q);
    if (F.quo !== "all" && F.quo !== st) return false;
    return F.quo !== "all" || yOf(q.date) === year || q.status === "draft" || q.status === "open";
  }).sort((a, b) => (b.date || "").localeCompare(a.date || "") || (b.number || "").localeCompare(a.number || ""));
  const filt = [
    ["all", `Alle ${year}`],
    ["draft", "Entwürfe"],
    ["open", "Offen"],
    ["accepted", "Angenommen"],
    ["billed", "Abgerechnet"],
    ["rejected", "Abgelehnt"],
    ["expired", "Abgelaufen"]
  ];
  return `
  <div class="head"><div class="head-l"><h3>Kostenvoranschläge & Angebote</h3><h1>Angebote</h1></div>
    <div class="toolbar">${yearSel()}<button class="btn primary" data-act="new-quote">Neues Angebot</button></div></div>
  <div class="filters" role="group" aria-label="Filter">${filt.map(([k, l]) => `<button data-act="f-quo" data-v="${k}" aria-pressed="${F.quo === k}">${l}</button>`).join("")}</div>
  ${!allReady() ? loading() : list.length ? `<div class="table-wrap sheet-card"><table>
    <thead><tr><th>Nr.</th><th>Datum</th><th>Empfänger</th><th>Gültig bis</th><th>Status</th><th class="r">Betrag</th><th></th></tr></thead><tbody>
    ${list.map(q => {
      const st = quoteState(q);
      const t = calcInv(q);
      return `<tr class="clickable" data-act="open-quote" data-id="${q.id}">
        <td class="mono">${q.number ? esc(q.number) : '<span class="muted">—</span>'}${q.billedInvoiceNumber ? `<span class="sub">Rechnung ${esc(q.billedInvoiceNumber)}</span>` : ""}</td>
        <td class="mono small">${fDate(q.date)}</td>
        <td>${esc(quoteTitle(q))}</td>
        <td class="small">${fDate(q.validUntil)}</td>
        <td>${chip(st)}</td>
        <td class="amt">${eur(t.gross)}</td>
        <td class="actions">
          ${st === "open" || st === "accepted" ? `<button class="btn sm" data-act="quote-to-invoice" data-id="${q.id}" data-stop title="Direkt als Rechnung abrechnen">In Rechnung</button>` : ""}
        </td></tr>`;
    }).join("")}
    </tbody></table></div>` : `<div class="sheet-card empty"><h2>Noch keine Angebote</h2><p>Erstelle Angebote für deine Kunden. Sobald das Angebot angenommen wird, kannst du es mit 1 Klick direkt in eine Rechnung umwandeln.</p><button class="btn primary" data-act="new-quote">Erstes Angebot schreiben</button></div>`}`;
}

function vInvoices() {
  const list = S.invoices.filter(i => {
    const st = invState(i);
    if (F.inv !== "all" && !(F.inv === st || (F.inv === "open" && st === "overdue"))) return false;
    return F.inv !== "all" || yOf(i.date) === year || i.status === "draft" || i.status === "open";
  }).sort((a, b) => (b.date || "").localeCompare(a.date || "") || (b.number || "").localeCompare(a.number || ""));
  const filt = [["all", `Alle ${year}`], ["draft", "Entwürfe"], ["open", "Offen"], ["overdue", "Überfällig"], ["paid", "Bezahlt"], ["cancelled", "Storniert"]];
  return `
  <div class="head"><div class="head-l"><h3>Ausgangsrechnungen</h3><h1>Rechnungen</h1></div>
    <div class="toolbar">${yearSel()}<button class="btn primary" data-act="new-invoice">Neue Rechnung</button></div></div>
  <div class="filters" role="group" aria-label="Filter">${filt.map(([k, l]) => `<button data-act="f-inv" data-v="${k}" aria-pressed="${F.inv === k}">${l}</button>`).join("")}</div>
  ${!allReady() ? loading() : list.length ? `<div class="table-wrap sheet-card"><table>
    <thead><tr><th>Nr.</th><th>Datum</th><th>Empfänger</th><th>Status</th><th class="r">Betrag</th><th></th></tr></thead><tbody>
    ${list.map(i => { const st = invState(i); const t = calcInv(i); return `<tr class="clickable" data-act="open-invoice" data-id="${i.id}">
      <td class="mono">${i.number ? esc(i.number) : '<span class="muted">—</span>'}${i.storno ? `<span class="sub">Storno zu ${esc(i.refNumber)}</span>` : ""}</td>
      <td class="mono small">${fDate(i.date)}</td><td>${esc(invTitle(i))}</td><td>${chip(st)}${i.paidDate && st === "paid" ? `<span class="sub">${fDate(i.paidDate)}</span>` : ""}</td>
      <td class="amt ${st === "cancelled" ? "strike" : ""}">${eur(t.gross)}</td>
      <td class="actions">${st === "open" || st === "overdue" ? `<button class="btn sm" data-act="mark-paid" data-id="${i.id}">Bezahlt</button>` : ""}</td></tr>`; }).join("")}
    </tbody></table></div>` : `<div class="sheet-card empty"><h2>Noch keine Rechnungen</h2><p>Lege eine Rechnung als Entwurf an. Sobald du sie festschreibst, bekommt sie die nächste fortlaufende Rechnungsnummer und lässt sich als PDF speichern.</p><button class="btn primary" data-act="new-invoice">Erste Rechnung schreiben</button></div>`}`;
}

function entriesRows() {
  const q = F.q.trim().toLowerCase();
  const rows = journal(year, period).filter(r => (F.ent === "all" || F.ent === r.kind) &&
    (!q || [r.party, r.desc, r.ref, CAT[r.category]].join(" ").toLowerCase().includes(q)));
  if (!rows.length) return `<div class="sheet-card empty"><p>${q ? "Keine Buchung passt zur Suche." : `Keine Buchungen für ${periodLabel(period, year)}. Erfasse eine Ausgabe oder Einnahme. Bezahlte Rechnungen erscheinen hier automatisch.`}</p></div>`;
  const sIn = rows.filter(r => r.kind === "in").reduce((a, r) => a + r.gross, 0), sOut = rows.filter(r => r.kind === "out").reduce((a, r) => a + r.gross, 0);
  return `<div class="table-wrap sheet-card"><table>
    <thead><tr><th>Datum</th><th>Partner / Beschreibung</th><th>Kategorie</th><th>Beleg</th><th class="r">Einnahme</th><th class="r">Ausgabe</th></tr></thead><tbody>
    ${rows.map(r => `<tr class="clickable" data-act="${r.src === "inv" ? "open-invoice" : "edit-entry"}" data-id="${r.id}">
      <td class="mono small">${fDate(r.date)}</td><td>${esc(r.party || "–")}<span class="sub">${esc(r.desc || "")}</span></td>
      <td class="small">${r.src === "inv" ? "Rechnung" : esc(CAT[r.category] || r.category)}</td>
      <td class="small">${r.src === "inv" ? `<span class="mono">${esc(r.ref)}</span>` : r.receiptId ? `<button class="btn sm ghost" data-act="view-receipt" data-id="${esc(r.receiptId)}" data-name="${esc(r.receiptName || r.party || 'Beleg')}" data-stop title="Beleg-Vorschau öffnen">👁 Vorschau</button><a class="icon-btn sm" href="/_blob/${esc(r.receiptId)}" target="_blank" rel="noopener" data-stop title="In neuem Tab öffnen" style="display:inline-grid;vertical-align:middle;margin-left:2px">↗</a>` : '<span class="muted">fehlt</span>'}</td>
      <td class="amt in">${r.kind === "in" ? num(r.gross) : ""}</td><td class="amt out">${r.kind === "out" ? num(r.gross) : ""}</td></tr>`).join("")}
    <tr class="total"><td colspan="4">Summe ${rows.length} Buchungen</td><td class="amt in">${num(sIn)}</td><td class="amt out">${num(sOut)}</td></tr>
    </tbody></table></div>`;
}

    <div class="toolbar">${yearSel()} ${periodSel()}<button class="btn" data-act="new-in">Einnahme</button><button class="btn primary" data-act="new-out">Ausgabe erfassen</button></div></div>

}

}

function vAnlagen() {
  const list = [...(S.fixedAssets || [])].sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  const withCalc = list.map(a => ({ ...a, calc: calcAsset(a, year) }));
  const relevant = withCalc.filter(a => yOf(a.date) <= year);

  // Summen für year
  const sumStart = r2(relevant.reduce((acc, a) => acc + a.calc.bookStart, 0));
  const sumAdd = r2(relevant.reduce((acc, a) => acc + a.calc.additions, 0));
  const sumAfa = r2(relevant.reduce((acc, a) => acc + a.calc.afa, 0));
  const sumEnd = r2(relevant.reduce((acc, a) => acc + a.calc.bookEnd, 0));

  return `
  <div class="head"><div class="head-l"><h3>Anlagenverzeichnis & AfA</h3><h1>Anlagen ${year}</h1></div>
    <div class="toolbar">${yearSel()}<button class="btn" data-act="export-assets-csv" ${downloads ? "" : "disabled"}>Anlagen als CSV</button>
      <button class="btn primary" data-act="new-asset">Anlagegut anlegen</button></div></div>
  <div class="kpis">
    <div class="kpi"><h3>Buchwert 01.01.</h3><span class="v">${eur(sumStart)}</span><span class="s">Anfangsbestand ${year}</span></div>
    <div class="kpi"><h3>Zugänge</h3><span class="v">${eur(sumAdd)}</span><span class="s">Investitionen ${year}</span></div>
    <div class="kpi"><h3>AfA ${year}</h3><span class="v out">${eur(sumAfa)}</span><span class="s">EÜR-Kennzahl 130</span></div>
    <div class="kpi"><h3>Buchwert 31.12.</h3><span class="v">${eur(sumEnd)}</span><span class="s">Endbestand ${year}</span></div>
  </div>
  <p class="note">Nach § 7 Abs. 1 EStG monatsgenau berechnet (Kaufmonat zählt voll). Bei Kleinunternehmern (§ 19 UStG) sind die Bruttokosten maßgebend (§ 9b Abs. 1 EStG). Die Jahres-AfA von <b class="mono">${eur(sumAfa)}</b> mindert deinen Gewinn automatisch in der Anlage EÜR (Kennzahl 130). Die Spalten entsprechen der Anlage AVEÜR in ELSTER.</p>
  ${!allReady() ? loading() : !relevant.length ? `<div class="sheet-card empty"><h2>Noch keine Anlagegüter für ${year}</h2><p>Erfasse Anschaffungen ab 800 € netto (z. B. Plotter, Computer, Arbeitsgeräte, Büromöbel). Kontobuch berechnet die monatsgenaue AfA und den Restbuchwert für die Anlage AVEÜR automatisch.</p><button class="btn primary" data-act="new-asset">Erstes Anlagegut anlegen</button></div>` : `
  <div class="table-wrap sheet-card"><table>
    <thead><tr><th>Bezeichnung</th><th>Anschaffung</th><th>Nutzungsdauer</th><th class="r">Buchwert 01.01.</th><th class="r">Zugänge</th><th class="r">AfA ${year}</th><th class="r">Buchwert 31.12.</th><th>Beleg</th></tr></thead><tbody>
    ${relevant.map(a => `<tr class="clickable" data-act="edit-asset" data-id="${a.id}">
      <td><b>${esc(a.name)}</b>${a.note ? `<span class="sub">${esc(a.note)}</span>` : ""}</td>
      <td class="small">${fDate(a.date)}<span class="sub">${eur(a.cost)}</span></td>
      <td class="small">${a.method === "gwg" ? "GWG (1 J.)" : `${a.nd} Jahre`}<span class="sub">${a.method === "gwg" ? "Sofortabschreibung" : "linear"}</span></td>
      <td class="amt">${num(a.calc.bookStart)}</td>
      <td class="amt in">${a.calc.additions ? num(a.calc.additions) : "–"}</td>
      <td class="amt out">${a.calc.afa ? num(a.calc.afa) : "–"}</td>
      <td class="amt">${num(a.calc.bookEnd)}</td>
      <td class="small">${a.receiptId ? `<button class="btn sm ghost" data-act="view-receipt" data-id="${esc(a.receiptId)}" data-name="${esc(a.receiptName || a.name || 'Beleg')}" data-stop title="Kaufbeleg ansehen">👁 Vorschau</button><a class="icon-btn sm" href="/_blob/${esc(a.receiptId)}" target="_blank" rel="noopener" data-stop title="In neuem Tab öffnen" style="display:inline-grid;vertical-align:middle;margin-left:2px">↗</a>` : '<span class="muted">–</span>'}</td>
    </tr>`).join("")}
    <tr class="total"><td colspan="3">Summe ${relevant.length} Anlagegüter</td><td class="amt">${num(sumStart)}</td><td class="amt in">${num(sumAdd)}</td><td class="amt out">${num(sumAfa)}</td><td class="amt">${num(sumEnd)}</td><td></td></tr>
  </tbody></table></div>`}`;
}

function vEuer() {

  <p class="note">Nach dem Zufluss-/Abflussprinzip (§ 4 Abs. 3 EStG): Rechnungen zählen im Zeitraum des Zahlungseingangs, Ausgaben im Zahlungszeitraum. Die Kennzahl (Kz.) entspricht der Anlage EÜR in ELSTER.</p>

    </tbody>
    <thead><tr><th style="padding-top:24px">Kz.</th><th style="padding-top:24px">Betriebsausgaben</th><th class="r" style="padding-top:24px">EUR</th></tr></thead><tbody>
    ${rowsOf(e.out)}

    ${s.kleinunternehmer ? `<p class="note">Als Kleinunternehmer ziehst du keine Vorsteuer ab. Ausgaben stehen deshalb mit dem Bruttobetrag in der EÜR.</p>` : `

        <div><span>Steuer 19 %</span><span class="mono">${eur(r2(e.ust19Base * 0.19))}</span></div>
        ${e.ust7Base ? `<div><span>Kz. 86 Steuerpfl. Umsatz 7 % (Netto)</span><span class="mono">${eur(e.ust7Base)}</span></div>
        <div><span>Steuer 7 %</span><span class="mono">${eur(r2(e.ust7Base * 0.07))}</span></div>` : ""}

  </aside></div>`}`;
}

/* {JAHR} im Präfix: die Nummern laufen pro Jahr und beginnen im neuen Jahr wieder bei 1. */
function nextInvoice(y = new Date().getFullYear()) {
  const s = sett(); const raw = s.invoicePrefix || ""; const prefix = raw.replaceAll("{JAHR}", y);
  const base = !raw.includes("{JAHR}") || Number(s.counterYear) === y ? Number(s.nextInvoiceNo || 1) : 1;
  const used = S.invoices.filter(i => i.number?.startsWith(prefix)).map(i => (parseInt(i.number.slice(prefix.length), 10) || 0) + 1);
  const n = Math.max(base, ...used);
  return { n, y, number: prefix + String(n).padStart(Number(s.numberPad || 3), "0") };
}
function nextQuote(y = new Date().getFullYear()) {
  const s = sett(); const raw = s.quotePrefix || "ANG-{JAHR}-"; const prefix = raw.replaceAll("{JAHR}", y);
  const base = !raw.includes("{JAHR}") || Number(s.quoteCounterYear) === y ? Number(s.nextQuoteNo || 1) : 1;
  const used = (S.quotes || []).filter(q => q.number?.startsWith(prefix)).map(q => (parseInt(q.number.slice(prefix.length), 10) || 0) + 1);
  const n = Math.max(base, ...used);
  return { n, y, number: prefix + String(n).padStart(Number(s.numberPad || 3), "0") };
}

function nextCustNo(taken = S.customers.map(c => c.customerNo)) {
  const nums = taken.filter(n => /^\d+$/.test(n || ""));
  if (!nums.length) return "1001";
  const top = nums.reduce((a, b) => (+b > +a ? b : a));
  return String(+top + 1).padStart(top.length, "0");
}

async function submitAsset(form) {
  const fd = new FormData(form);
  const id = form.dataset.id || uid();
  const old = (S.fixedAssets || []).find(x => x.id === id) || {};
  const cost = r2(parseNum(fd.get("cost")));
  if (!cost) { toast("Bitte gib Anschaffungskosten ein.", true); return; }
  const name = fd.get("name").trim();
  if (!name) { toast("Bitte gib eine Bezeichnung ein.", true); return; }
  const nd = Math.max(1, parseInt(fd.get("nd"), 10) || 1);
  const data = {
    name,
    date: fd.get("date"),
    cost,
    nd,
    method: fd.get("method") || "linear",
    note: (fd.get("note") || "").trim(),
    receiptId: old.receiptId || null,
    receiptName: old.receiptName || null,
    createdAt: old.createdAt || new Date().toISOString()
  };

  const btn = $("button[type=submit]", form);
  btn.disabled = true;

  const file = fd.get("file");
  let toDelete = null;
  if (fd.get("removeReceipt") && data.receiptId) {
    toDelete = data.receiptId;
    data.receiptId = null;
    data.receiptName = null;
  }
  if (file && file.size && assets) {
    btn.textContent = "Lade Beleg hoch …";
    const ext = (file.name.split(".").pop() || "").toLowerCase();
    const type = { pdf: "application/pdf", jpg: "image/jpeg", jpeg: "image/jpeg", png: "image/png", webp: "image/webp" }[ext] || file.type;
    try {
      const up = await assets.upload(file, { type });
      if (data.receiptId) toDelete = data.receiptId;
      data.receiptId = up.id;
      data.receiptName = file.name;
    } catch (err) {
      console.error(err);
      toast("Beleg konnte nicht hochgeladen werden.", true);
      btn.disabled = false;
      btn.textContent = "Speichern";
      return;
    }
  }

  if (await saveDoc("fixedAssets", id, data)) {
    if (toDelete && assets) assets.delete(toDelete).catch(() => {});
    closeModal();
    toast("Anlagegut gespeichert");
  } else {
    btn.disabled = false;
    btn.textContent = "Speichern";
  }
}
function generateAssetsCsv(y = year) {
  const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const list = [...(S.fixedAssets || [])].sort((a, b) => (a.date || "").localeCompare(b.date || ""));
  const header = ["Bezeichnung", "Anschaffungsdatum", "Anschaffungskosten (EUR)", "Nutzungsdauer (Jahre)", "Methode",
    `Buchwert 01.01.${y}`, `Zugänge ${y}`, `AfA ${y}`, `Buchwert 31.12.${y}`, "Notiz"];
  const lines = [header.map(q).join(";")];
  list.forEach(a => {
    const c = calcAsset(a, y);
    lines.push([
      a.name,
      fDate(a.date),
      num(a.cost),
      a.nd,
      a.method === "gwg" ? "GWG (Sofortabschreibung)" : "Lineare AfA",
      num(c.bookStart),
      num(c.additions),
      num(c.afa),
      num(c.bookEnd),
      a.note || ""
    ].map(q).join(";"));
  });
  return "\ufeff" + lines.join("\r\n");
}

function partyNames(kind) {

  const seen = new Set(); const out = [];
  for (const n of [...S.entries.filter(x => x.kind === kind).map(x => x.party), ...names]) {
    if (n && !seen.has(n.toLowerCase())) { seen.add(n.toLowerCase()); out.push(n); }

  return out.sort((a, b) => a.localeCompare(b, "de"));
}

function itemTemplates() {
  const docs = [...(S.invoices || []), ...(S.quotes || [])].sort((a, b) => String(b.date || "").localeCompare(String(a.date || "")));

  for (const u of [...STD_UNITS, ...itemTemplates().map(t => t.unit)]) {

}

function readImageAsDataUrl(file, maxDimension = 2400) {
  return new Promise((resolve, reject) => {
    if (!file) return reject(new Error("Keine Datei angegeben"));
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("Datei konnte nicht gelesen werden"));
    reader.onload = () => {
      const dataUrl = reader.result;
      if (typeof Image === "undefined") return resolve(dataUrl);
      const img = new Image();
      img.onerror = () => reject(new Error("Bild konnte nicht geladen werden"));
      img.onload = () => {
        let { width, height } = img;
        if (!width || !height) return resolve(dataUrl);
        if (width <= maxDimension && height <= maxDimension && file.size < 600000) {
          return resolve(dataUrl);
        }
        if (width > maxDimension || height > maxDimension) {
          if (width > height) {
            height = Math.round((height * maxDimension) / width);
            width = maxDimension;
          } else {
            width = Math.round((width * maxDimension) / height);
            height = maxDimension;
          }
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        const isPng = file.type === "image/png" || file.name?.toLowerCase().endsWith(".png");
        const mime = isPng ? "image/png" : "image/jpeg";
        const resUrl = canvas.toDataURL(mime, isPng ? undefined : 0.88);
        resolve(resUrl);
      };
      img.src = dataUrl;
    };
    reader.readAsDataURL(file);
  });
}

function xmlEsc(s) {

function date102(iso) {

function unitCode(u) {
  const s = String(u || "").trim().toLowerCase();

  if (["tag", "tage"].includes(s)) return "DAY";

  if (["qm", "m²", "m2"].includes(s)) return "MTK";

function parseRecipient(text, customer) {
  if (customer) {

      name: customer.name || "",
      contact: customer.contact || "",
      street: customer.street || "",
      zip: customer.zip || "",
      city: customer.city || "",
      country: customer.country ? (customer.country.length === 2 ? customer.country.toUpperCase() : "DE") : "DE",
      vatId: customer.vatId || "",
      customerNo: customer.customerNo || ""
    };
  }
  const lines = (text || "").split("\n").map(l => l.trim()).filter(Boolean);
  const name = lines[0] || "Kunde";
  let street = "", zip = "", city = "", country = "DE";
  for (let i = 1; i < lines.length; i++) {
    const l = lines[i];
    const m = l.match(/^(\d{4,5})\s+(.+)$/);
    if (m) {
      zip = m[1]; city = m[2];
    } else if (i === lines.length - 1 && ["deutschland", "österreich", "schweiz"].includes(l.toLowerCase())) {
      country = l.toLowerCase() === "österreich" ? "AT" : l.toLowerCase() === "schweiz" ? "CH" : "DE";

}

  const xmp = `<?xpacket begin="" id="W5M0MpCehiHzreSzNTczkc9d"?>

      <pdfaExtension:schemas>
        <rdf:Bag>
          <rdf:li rdf:parseType="Resource">
            <pdfaSchema:schema>Factur-X PDFA Extension Schema</pdfaSchema:schema>
            <pdfaSchema:namespaceURI>urn:factur-x:pdfa:CrossIndustryDocument:invoice:1p0#</pdfaSchema:namespaceURI>
            <pdfaSchema:prefix>zf</pdfaSchema:prefix>
            <pdfaSchema:property>
              <rdf:Seq>

                  <pdfaProperty:category>external</pdfaProperty:category>
                  <pdfaProperty:description>The conformance level of the embedded Factur-X data</pdfaProperty:description>

              </rdf:Seq>
            </pdfaProperty:property>

        </rdf:Bag>
      </pdfaExtension:schemas>

  </rdf:RDF>
</x:xmpmeta>
<?xpacket end="w"?>`;

  const xmpBytes = typeof TextEncoder !== "undefined"
    ? new TextEncoder().encode(xmp)
    : (typeof Buffer !== "undefined" ? Buffer.from(xmp, "utf8") : new Uint8Array(0));
  let xmpStr = "";
  for (let i = 0; i < xmpBytes.length; i++) xmpStr += String.fromCharCode(xmpBytes[i]);

  let fileObjId = null, fileSpecId = null, metaObjId = null;

  doc.internal.events.subscribe("putAdditionalObjects", function() {
    fileObjId = this.internal.newObject();
    this.internal.write(`<< /Type /EmbeddedFile /Subtype /text#2Fxml /Length ${len} /Params << /Size ${len} >> >>`);
    this.internal.write("stream");
    this.internal.write(binaryStr);
    this.internal.write("endstream");
    this.internal.write("endobj");

    fileSpecId = this.internal.newObject();
    this.internal.write(`<< /Type /Filespec /F (factur-x.xml) /UF (factur-x.xml) /EF << /F ${fileObjId} 0 R /UF ${fileObjId} 0 R >> /AFRelationship /Alternative /Desc (Factur-X/ZUGFeRD E-Invoice) >>`);

/* ---------- E-Rechnungs-Import (Empfang) ---------- */
function parseEInvoiceXml(xmlText) {
  if (!xmlText) return null;
  const getTag = (xml, tag) => {
    const m = xml.match(new RegExp("<(?:[a-zA-Z0-9_-]+:)?" + tag + "[^>]*>([^<]+)<\\/", "i"));
    return m ? m[1].trim() : "";
  };
  if (xmlText.includes("CrossIndustryInvoice")) {
    const supplierMatch = xmlText.match(/<[^:]*:SellerTradeParty[\s\S]*?<[^:]*:Name[^>]*>([^<]+)<\//i);
    const party = supplierMatch ? supplierMatch[1].trim() : getTag(xmlText, "Name");
    let dateRaw = getTag(xmlText, "DateTimeString") || getTag(xmlText, "IssueDateTime");
    let date = "";
    if (dateRaw && dateRaw.length === 8 && /^\d{8}$/.test(dateRaw)) {
      date = dateRaw.slice(0, 4) + "-" + dateRaw.slice(4, 6) + "-" + dateRaw.slice(6, 8);
    }
    const idMatch = xmlText.match(/<[a-zA-Z0-9_-]*:?ExchangedDocument\b[\s\S]*?<[a-zA-Z0-9_-]*:?ID[^>]*>([^<]+)<\//i);
    const ref = idMatch ? idMatch[1].trim() : getTag(xmlText, "ID");
    const grossStr = getTag(xmlText, "DuePayableAmount") || getTag(xmlText, "GrandTotalAmount");
    const vatRateStr = getTag(xmlText, "RateApplicablePercent");
    return {
      party,
      date,
      ref,
      gross: grossStr ? parseFloat(grossStr) : null,
      vatRate: vatRateStr ? parseFloat(vatRateStr) : null,
      format: "ZUGFeRD/CII"
    };
  }
  if (xmlText.includes("Invoice") && (xmlText.includes("ubl") || xmlText.includes("urn:oasis:names"))) {
    const supplierMatch = xmlText.match(/<[^:]*:AccountingSupplierParty[\s\S]*?<[^:]*:PartyName[\s\S]*?<[^:]*:Name[^>]*>([^<]+)<\//i);
    const party = supplierMatch ? supplierMatch[1].trim() : getTag(xmlText, "Name");
    const date = getTag(xmlText, "IssueDate");
    const ref = getTag(xmlText, "ID");
    const grossStr = getTag(xmlText, "PayableAmount");
    const vatRateStr = getTag(xmlText, "Percent");
    return {
      party,
      date,
      ref,
      gross: grossStr ? parseFloat(grossStr) : null,
      vatRate: vatRateStr ? parseFloat(vatRateStr) : null,
      format: "XRechnung/UBL"
    };
  }
  return null;
}

async function extractEInvoiceFromPdf(arrayBuffer) {
  const bytes = new Uint8Array(arrayBuffer);
  const text = new TextDecoder("latin1").decode(bytes);
  const xmlStart = text.indexOf("<rsm:CrossIndustryInvoice");
  if (xmlStart !== -1) {
    const xmlEnd = text.indexOf("</rsm:CrossIndustryInvoice>", xmlStart);
    if (xmlEnd !== -1) {
      const xmlChunk = new TextDecoder("utf-8").decode(bytes.subarray(xmlStart, xmlEnd + 27));
      return parseEInvoiceXml(xmlChunk);
    }
  }
  const ublStart = text.indexOf("<Invoice");
  if (ublStart !== -1 && (text.includes("ubl") || text.includes("urn:oasis:names"))) {
    const ublEnd = text.indexOf("</Invoice>", ublStart);
    if (ublEnd !== -1) {
      const xmlChunk = new TextDecoder("utf-8").decode(bytes.subarray(ublStart, ublEnd + 10));
      return parseEInvoiceXml(xmlChunk);
    }
  }
  if (text.includes("/EmbeddedFile") && typeof DecompressionStream !== "undefined") {
    const efIdx = text.indexOf("/EmbeddedFile");
    const streamIdx = text.indexOf("stream", efIdx);
    if (streamIdx !== -1) {
      let start = streamIdx + 6;
      if (bytes[start] === 0x0d && bytes[start + 1] === 0x0a) start += 2;
      else if (bytes[start] === 0x0a) start += 1;
      const endStreamIdx = text.indexOf("endstream", start);
      if (endStreamIdx !== -1) {
        let end = endStreamIdx;
        if (bytes[end - 1] === 0x0a && bytes[end - 2] === 0x0d) end -= 2;
        else if (bytes[end - 1] === 0x0a) end -= 1;
        try {
          const ds = new DecompressionStream("deflate");
          const writer = ds.writable.getWriter();
          writer.write(bytes.subarray(start, end));
          writer.close();
          const reader = ds.readable.getReader();
          const chunks = [];
          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            chunks.push(value);
          }
          let totalLen = chunks.reduce((acc, c) => acc + c.length, 0);
          let merged = new Uint8Array(totalLen);
          let off = 0;
          for (const c of chunks) { merged.set(c, off); off += c.length; }
          const decompressed = new TextDecoder("utf-8").decode(merged);
          return parseEInvoiceXml(decompressed);
        } catch (e) {}
      }
    }
  }
  return null;
}

async function handleReceiptFileInput(input) {
  const file = input.files[0];
  if (!file) return;
  const container = $("#receipt-preview-container");
  if (container) {
    const objUrl = URL.createObjectURL(file);
    container.innerHTML = receiptPreviewHtml(objUrl, file.name);
  }
  const ext = (file.name.split(".").pop() || "").toLowerCase();
  let parsed = null;
  try {
    if (ext === "xml") {
      parsed = parseEInvoiceXml(await file.text());
    } else if (ext === "pdf") {
      parsed = await extractEInvoiceFromPdf(await file.arrayBuffer());
    }
  } catch (err) {
    console.warn("E-Rechnungs-Erkennung:", err);
  }
  if (parsed) {
    const f = input.form;
    if (parsed.party && !f.party.value) {
      f.party.value = parsed.party;
      const cat = lastCategory(new FormData(f).get("kind"), parsed.party);
      if (cat && f.category) f.category.value = cat;
    }
    if (parsed.date && !f.date.value) f.date.value = parsed.date;
    if (parsed.gross != null && (!f.gross.value || f.gross.value === "0,00")) f.gross.value = numIn(parsed.gross);
    if (parsed.ref && !f.ref.value) f.ref.value = parsed.ref;
    if (parsed.vatRate != null && f.vatRate) {
      const vr = Math.round(parsed.vatRate);
      if ([19, 7, 0].includes(vr)) f.vatRate.value = String(vr);
    }
    toast(`E-Rechnung erkannt (${parsed.format}): Daten von „${parsed.party || "Lieferant"}“ übernommen!`);
  }
}

function invoicePdf(inv, outputType = "blob") {

    console.warn("ZUGFeRD-Einbettung fehlgeschlagen:", err);

    if (s.stationeryData) {

      const x = R - w;

      doc.addImage(s.logoData, x, yPos, w, h);
      return { w, h, x, y: yPos };

  // Infoblock
